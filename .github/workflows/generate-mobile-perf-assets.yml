name: generate-mobile-perf-assets
on:
  push:
    branches:
      - perf/mobile-pass2-20261007
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/mobile-pass2-20261007
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate responsive hero and local font CSS
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet pillow
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          src=Path('Public/assets/art/hero.webp')
          im=Image.open(src).convert('RGB')
          for width,quality in [(640,76),(768,77),(960,78)]:
              height=round(im.height*width/im.width)
              out=im.resize((width,height),Image.Resampling.LANCZOS)
              out.save(src.with_name(f'hero-{width}.webp'),'WEBP',quality=quality,method=6)
              print(src.with_name(f'hero-{width}.webp'), out.size)
          PY
          curl -fsSL             -A "Mozilla/5.0 (Linux; Android 10; K) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/154.0.0.0 Mobile Safari/537.36"             "https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700;800;900&display=swap"             -o Public/fonts-inline.css
          ls -lh Public/assets/art/hero*.webp Public/fonts-inline.css
      - name: Commit generated assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Public/assets/art/hero-640.webp Public/assets/art/hero-768.webp Public/assets/art/hero-960.webp Public/fonts-inline.css
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "perf: add responsive hero assets and inline font CSS"
          git push origin HEAD:perf/mobile-pass2-20261007
