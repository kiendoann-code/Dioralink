name: Artisan recovery syntax
on:
  pull_request:
    paths: ['artisan-recovery.js','Public/recovery-claim.js','Public/app.js','Server.js','Public/index.html','.github/workflows/artisan-recovery.yml']
  push:
    branches: [main]
    paths: ['artisan-recovery.js','Public/recovery-claim.js','Public/app.js','Server.js']
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
      - run: node --check artisan-recovery.js
      - run: node --check Public/recovery-claim.js
      - run: node --check Public/app.js
      - run: node --check Server.js
      - run: npm test
