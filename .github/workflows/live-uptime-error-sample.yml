name: live-uptime-error-sample
on:
  push:
    branches:
      - ops/uptime-error-check-20261007
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Sample production availability and error rate
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, time, urllib.request, urllib.error, statistics
          from concurrent.futures import ThreadPoolExecutor, as_completed

          targets = {
            "homepage": "https://dioralink.xyz/",
            "health_custom_domain": "https://dioralink.xyz/api/health",
            "health_render_origin": "https://dioralink.onrender.com/api/health",
            "marketplace": "https://dioralink.xyz/marketplace",
          }
          REQUESTS=100
          TIMEOUT=15

          def one(name,url,i):
              req=urllib.request.Request(url,headers={"User-Agent":"DioraLink-Uptime-Check/1.0","Cache-Control":"no-cache"})
              start=time.perf_counter()
              status=None; body=""; err=None
              try:
                  with urllib.request.urlopen(req,timeout=TIMEOUT) as r:
                      status=r.status
                      body=r.read(2048).decode("utf-8","replace")
              except urllib.error.HTTPError as e:
                  status=e.code
                  try: body=e.read(2048).decode("utf-8","replace")
                  except Exception: pass
                  err=f"HTTPError:{e.code}"
              except Exception as e:
                  err=f"{type(e).__name__}:{e}"
              ms=(time.perf_counter()-start)*1000
              health_ok=True
              if "health" in name and status==200:
                  try:
                      j=json.loads(body)
                      health_ok=(j.get("status")=="ok" and j.get("database")=="connected")
                  except Exception:
                      health_ok=False
              return {"name":name,"i":i,"status":status,"ms":ms,"err":err,"health_ok":health_ok}

          all_rows=[]
          for name,url in targets.items():
              rows=[]
              with ThreadPoolExecutor(max_workers=10) as ex:
                  futs=[ex.submit(one,name,url,i) for i in range(REQUESTS)]
                  for f in as_completed(futs): rows.append(f.result())
              all_rows.extend(rows)
              oks=[r for r in rows if r["status"] is not None and 200 <= r["status"] < 400 and r["health_ok"]]
              errors=[r for r in rows if r not in oks]
              five=[r for r in rows if r["status"] is not None and r["status"] >= 500]
              four=[r for r in rows if r["status"] is not None and 400 <= r["status"] < 500]
              network=[r for r in rows if r["status"] is None]
              lat=sorted(r["ms"] for r in rows if r["status"] is not None)
              def pct(p):
                  if not lat: return None
                  idx=max(0,min(len(lat)-1,round((len(lat)-1)*p)))
                  return round(lat[idx],1)
              out={
                  "target":name,
                  "url":url,
                  "requests":len(rows),
                  "success":len(oks),
                  "availability_pct":round(len(oks)*100/len(rows),3),
                  "error_rate_pct":round(len(errors)*100/len(rows),3),
                  "http_5xx_rate_pct":round(len(five)*100/len(rows),3),
                  "http_4xx_rate_pct":round(len(four)*100/len(rows),3),
                  "network_error_rate_pct":round(len(network)*100/len(rows),3),
                  "latency_ms":{"p50":pct(.50),"p95":pct(.95),"p99":pct(.99),"max":round(max(lat),1) if lat else None},
                  "status_counts":{}
              }
              for r in rows:
                  k=str(r["status"]) if r["status"] is not None else "network_error"
                  out["status_counts"][k]=out["status_counts"].get(k,0)+1
              print(json.dumps(out,ensure_ascii=False))

          total=len(all_rows)
          ok=sum(1 for r in all_rows if r["status"] is not None and 200<=r["status"]<400 and r["health_ok"])
          err=total-ok
          five=sum(1 for r in all_rows if r["status"] is not None and r["status"]>=500)
          net=sum(1 for r in all_rows if r["status"] is None)
          print("OVERALL",json.dumps({
              "requests":total,
              "success":ok,
              "availability_pct":round(ok*100/total,3),
              "error_rate_pct":round(err*100/total,3),
              "http_5xx_rate_pct":round(five*100/total,3),
              "network_error_rate_pct":round(net*100/total,3)
          }))
          PY
