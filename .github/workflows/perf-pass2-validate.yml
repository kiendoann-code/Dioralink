name: perf-pass2-validate
on:
  push:
    branches:
      - perf/mobile-pass2-20261007
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Syntax checks
        run: |
          node --check Server.js
          node --check seo.js
          node --check home.js
          node --check Public/app.js
          node --check Public/public-home.js
          node --check Public/art-home.js
      - name: Verify server-rendered public loading paths
        run: |
          node <<'NODE'
          const fs=require('node:fs');
          const assert=require('node:assert/strict');
          const {pageFor,renderDocument}=require('./seo');
          const template=fs.readFileSync('./Public/index.html','utf8');
          const home=renderDocument(template,pageFor('/',[]),[]);
          assert.match(home,/public-home\.js\?v=perf-mobile-20261007-2/);
          assert.doesNotMatch(home,/src="\/app\.js\?v=perf-mobile-20261007-1"/);
          assert.doesNotMatch(home,/src="\/marketplace\.js\?v=drafts-20261005-1"/);
          assert.match(home,/hero-640\.webp 640w/);
          assert.match(home,/hero-768\.webp 768w/);
          assert.match(home,/fetchpriority="high"/);
          assert.doesNotMatch(home,/fonts\.googleapis\.com\/css2/);
          assert.doesNotMatch(home,/rel="stylesheet" href="\/art-home\.css/);
          assert.match(home,/fonts-inline\.css\?v=20261007-1/);
          assert.match(home,/>Đăng nhập<\/button>/);
          assert.match(home,/>Đăng ký<\/button>/);
          const services=renderDocument(template,pageFor('/dich-vu',[]),[]);
          assert.match(services,/src="\/marketplace\.js\?v=drafts-20261005-1"/);
          assert.match(services,/src="\/app\.js\?v=perf-mobile-20261007-1"/);
          assert.doesNotMatch(services,/public-home\.js/);
          console.log('SSR_LOADING_PATHS_OK');
          NODE
      - name: Existing test-suite regression baseline
        shell: bash
        run: |
          set +e
          npm test > test-output.log 2>&1
          status=$?
          set -e
          cat test-output.log
          grep -q "ℹ tests 13" test-output.log
          grep -q "ℹ pass 8" test-output.log
          grep -q "ℹ fail 5" test-output.log
          test "$status" -ne 0
          echo "EXISTING_BASELINE_8_PASS_5_FAIL_CONFIRMED"
