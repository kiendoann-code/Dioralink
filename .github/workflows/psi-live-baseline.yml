name: psi-live-baseline
on:
  push:
    branches:
      - perf/baseline-control-20261007
jobs:
  pagespeed:
    runs-on: ubuntu-latest
    steps:
      - name: Measure production through PSI v5 proxy
        shell: bash
        run: |
          set -euo pipefail
          for strategy in mobile desktop; do
            echo "=== $strategy ==="
            curl --fail-with-body --silent --show-error --get               "https://modpagespeed.com/psi/v5/runPagespeed"               --data-urlencode "url=https://dioralink.xyz/"               --data-urlencode "strategy=$strategy"               -o "$strategy.json"
            jq --arg strategy "$strategy" '{
              strategy:$strategy,
              score:(.lighthouseResult.categories.performance.score*100),
              fcp_ms:.lighthouseResult.audits["first-contentful-paint"].numericValue,
              lcp_ms:.lighthouseResult.audits["largest-contentful-paint"].numericValue,
              tbt_ms:.lighthouseResult.audits["total-blocking-time"].numericValue,
              cls:.lighthouseResult.audits["cumulative-layout-shift"].numericValue,
              speed_index_ms:.lighthouseResult.audits["speed-index"].numericValue,
              interactive_ms:.lighthouseResult.audits["interactive"].numericValue,
              field_lcp_ms:.loadingExperience.metrics.LARGEST_CONTENTFUL_PAINT_MS.percentile,
              field_inp_ms:.loadingExperience.metrics.INTERACTION_TO_NEXT_PAINT.percentile,
              field_cls:.loadingExperience.metrics.CUMULATIVE_LAYOUT_SHIFT_SCORE.percentile
            }' "$strategy.json"
          done
