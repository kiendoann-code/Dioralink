name: psi-live-baseline
on:
  push:
    branches:
      - perf/baseline-control-20261007
jobs:
  pagespeed:
    runs-on: ubuntu-latest
    steps:
      - name: Discover public PSI proxy endpoint
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL "https://modpagespeed.com/analyze/" -o page.html
          echo "INLINE MATCHES"
          grep -nEi "fetch\(|pagespeedonline|runPagespeed|/api/" page.html | head -80 || true
          echo "SCRIPT SOURCES"
          grep -oE '<script[^>]+src="[^"]+"' page.html | sed -E 's/.*src="([^"]+)".*/\1/' | tee scripts.txt || true
          while IFS= read -r src; do
            [ -z "$src" ] && continue
            case "$src" in
              http*) url="$src" ;;
              /*) url="https://modpagespeed.com$src" ;;
              *) url="https://modpagespeed.com/analyze/$src" ;;
            esac
            echo "=== $url ==="
            curl -fsSL "$url" | grep -nEi "fetch\(|pagespeedonline|runPagespeed|/api/" | head -80 || true
          done < scripts.txt
