name: DioraLink Marketplace wallet regression
on:
  push:
    paths:
      - 'marketplace*.js'
      - 'wallet.js'
      - 'Public/marketplace.js'
      - 'test/marketplace.test.js'
      - 'test/wallet.test.js'
      - '.github/workflows/marketplace-wallet-regression.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node --test test/marketplace.test.js test/wallet.test.js
