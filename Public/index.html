  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <script>
    (() => {
      const loadFonts=()=>{
        if(document.getElementById('dioralink-font-stylesheet')) return;
        const link=document.createElement('link');
        link.id='dioralink-font-stylesheet';
        link.rel='stylesheet';
        link.href='/fonts-inline.css?v=20261007-1';
        document.head.appendChild(link);
      };
      if(document.readyState==='complete') {
        setTimeout(loadFonts,0);
      } else {
        window.addEventListener('load',loadFonts,{once:true});
      }
    })();
  </script>
  <script>
    (() => {
      let lucidePromise;
      window.ensureLucide = function(){
        if(window.lucide) return Promise.resolve(window.lucide);
        if(lucidePromise) return lucidePromise;
        lucidePromise = new Promise((resolve,reject)=>{
          const script=document.createElement('script');
          script.src='https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js';
          script.async=true;
          script.onload=()=>{ try{ window.lucide?.createIcons(); }catch(e){} resolve(window.lucide); };
          script.onerror=()=>reject(new Error('Lucide failed to load'));
          document.head.appendChild(script);
        });
        lucidePromise.catch(()=>{ lucidePromise=null; });
        return lucidePromise;
      };
      const loadLucide=()=>window.ensureLucide().catch(()=>{});
      if(location.pathname==='/'){
        window.addEventListener('pointerdown',loadLucide,{once:true,passive:true});
        window.addEventListener('keydown',loadLucide,{once:true});
      }else{
        loadLucide();
      }
    })();
  </script>
