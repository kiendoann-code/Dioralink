<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DioraLink — Commission Platform for Customers & Artisans</title>
  <meta name="description" content="DioraLink connects customers with miniature and diorama artisans from discovery to commission, project delivery and payment.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js" defer fetchpriority="low"></script>
  <script>
    window.DIORALINK_CONFIG = {
      apiBase: "",
      googleClientId: "501903521909-m9tnb539pvjbfp331ndiogv0t9actauo.apps.googleusercontent.com",
      facebookAppId: "YOUR_FACEBOOK_APP_ID",
      version: "V2.5",
      demoMode: false
    };
  </script>
  <script>
    window.fbAsyncInit = function() {
      if (!window.DIORALINK_CONFIG?.facebookAppId || window.DIORALINK_CONFIG.facebookAppId.includes("YOUR_FACEBOOK")) return;
      if (!window.FB) return;
      FB.init({appId:window.DIORALINK_CONFIG.facebookAppId,cookie:true,xfbml:true,version:'v26.0'});
    };
  </script>
  <style>
    :root{
      --bg:#071E29;
      --panel:#0C2A35;
      --panel-2:#103640;
      --mint:#81D8D0;
      --mint-dark:#4FA8A1;
      --white:#F9FFFF;
      --muted:#91B0B0;
      --line:rgba(255,255,255,.10);
      --danger:#F18A8A;
      --warning:#F0C674;
      --success:#7DE2A5;
      --shadow:0 20px 50px rgba(0,0,0,.20);
    }
    *{box-sizing:border-box}
    html{scroll-behavior:smooth;max-width:100%;overflow-x:hidden}
    body{margin:0;background:var(--bg);color:var(--white);font-family:Inter,"Segoe UI",Arial,sans-serif;min-height:100vh;max-width:100%;overflow-x:hidden}
    button,input,select,textarea{font:inherit}
    button{cursor:pointer}
    a{text-decoration:none;color:inherit}
    .display{font-family:"Barlow Condensed",Inter,"Segoe UI",Arial,sans-serif}
    .shell{max-width:1440px;margin:auto}
    .header{position:sticky;top:0;z-index:50;background:rgba(7,30,41,.94);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
    .header-inner{max-width:1440px;width:100%;min-width:0;margin:auto;padding:10px 20px;display:flex;align-items:center;gap:14px}
    .brand{display:flex;align-items:center;gap:10px;min-width:220px;flex:0 1 auto}
    .brand-mark{width:34px;height:34px;border:1px solid rgba(129,216,208,.5);display:grid;place-items:center;background:rgba(129,216,208,.08)}
    .brand-name{font-weight:900;letter-spacing:.16em;font-size:13px}
    .brand-sub{font-size:8px;color:var(--muted);letter-spacing:.22em;text-transform:uppercase;margin-top:1px}
    .nav{display:flex;gap:5px;align-items:center;flex:1 1 auto;min-width:0;overflow:visible}
    .nav-btn{border:1px solid transparent;background:transparent;color:#A9C2C2;padding:9px 11px;font-size:9px;letter-spacing:.14em;text-transform:uppercase;white-space:nowrap}
    .nav-btn:hover,.nav-btn.active{background:rgba(129,216,208,.08);border-color:rgba(129,216,208,.16);color:var(--white)}
    .header-actions{display:flex;gap:8px;align-items:center;flex:0 0 auto;min-width:0;white-space:nowrap}
    #auth-header-actions{display:flex;align-items:center;gap:8px;flex:0 0 auto;min-width:0;white-space:nowrap}
    .icon-btn{width:38px;height:38px;background:transparent;border:1px solid var(--line);color:#C8D9D9;display:grid;place-items:center;position:relative}
    .icon-btn:hover{border-color:rgba(129,216,208,.35);color:var(--mint)}
    .dot{position:absolute;right:6px;top:5px;width:7px;height:7px;background:var(--mint);border-radius:50%;box-shadow:0 0 10px rgba(129,216,208,.8)}
    .avatar{width:38px;height:38px;border-radius:50%;object-fit:cover;border:1px solid rgba(129,216,208,.24);background:#163D47}
    .btn{border:1px solid var(--line);background:transparent;color:var(--white);padding:11px 15px;font-size:10px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;transition:.18s ease}
    .btn:hover{transform:translateY(-1px);border-color:rgba(129,216,208,.40)}
    .btn-mint{background:var(--mint);color:#09202A;border-color:var(--mint)}
    .btn-mint:hover{background:#9BE4DE;border-color:#9BE4DE}
    .btn-danger{border-color:rgba(241,138,138,.35);color:#FFD0D0}
    .btn-sm{padding:8px 11px;font-size:9px}
    .page{padding:34px 20px 80px}
    .grid{display:grid;gap:16px}
    .card{background:linear-gradient(180deg,rgba(12,42,53,.98),rgba(9,34,44,.98));border:1px solid var(--line);box-shadow:var(--shadow)}
    .card-soft{background:rgba(255,255,255,.025);border:1px solid var(--line)}
    .pad{padding:20px}
    .hero{padding:56px 0 30px;display:grid;grid-template-columns:1.15fr .85fr;gap:26px;align-items:stretch}
    .hero-main{padding:34px;background:radial-gradient(circle at 100% 0,rgba(129,216,208,.11),transparent 38%),linear-gradient(145deg,#0C2A35,#082530);border:1px solid rgba(129,216,208,.11)}
    .eyebrow{font-size:9px;letter-spacing:.22em;text-transform:uppercase;color:var(--mint);font-weight:800}
    h1,h2,h3,h4,p{margin:0}
    .hero-title{font-size:clamp(52px,8vw,112px);line-height:.84;letter-spacing:.01em;text-transform:uppercase;margin-top:15px}
    .hero-copy{max-width:640px;color:#ABC4C4;line-height:1.75;font-size:14px;margin-top:22px}
    .hero-cta{display:flex;gap:10px;flex-wrap:wrap;margin-top:26px}
    .hero-side{display:grid;grid-template-rows:1fr auto;gap:16px}
    .stat-box{padding:22px;background:linear-gradient(145deg,#0F3440,#0A2731);border:1px solid var(--line)}
    .stat-num{font-family:"Barlow Condensed",Inter,"Segoe UI",Arial,sans-serif;font-size:52px;line-height:1}
    .stat-label{margin-top:7px;color:var(--muted);font-size:9px;text-transform:uppercase;letter-spacing:.16em}
    .section-head{display:flex;justify-content:space-between;gap:16px;align-items:flex-end;margin:34px 0 16px}
    .section-title{font-family:"Barlow Condensed",Inter,"Segoe UI",Arial,sans-serif;font-size:42px;text-transform:uppercase;line-height:.9}
    .muted{color:var(--muted)}
    .tiny{font-size:9px;letter-spacing:.1em;text-transform:uppercase}
    .small{font-size:12px}
    .body{font-size:13px;line-height:1.7;color:#ABC4C4}
    .row{display:flex;align-items:center;gap:10px}
    .between{display:flex;justify-content:space-between;align-items:center;gap:12px}
    .wrap{display:flex;flex-wrap:wrap;gap:8px}
    .pill{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);padding:6px 9px;font-size:9px;letter-spacing:.09em;text-transform:uppercase;color:#B7CCCC}
    .pill-mint{border-color:rgba(129,216,208,.24);background:rgba(129,216,208,.08);color:var(--mint)}
    .pill-success{border-color:rgba(125,226,165,.25);background:rgba(125,226,165,.08);color:var(--success)}
    .pill-warning{border-color:rgba(240,198,116,.25);background:rgba(240,198,116,.08);color:var(--warning)}
    .pill-danger{border-color:rgba(241,138,138,.25);background:rgba(241,138,138,.08);color:var(--danger)}
    .field{width:100%;background:#08232D;border:1px solid rgba(255,255,255,.11);color:var(--white);padding:11px 12px;outline:none}
    .field:focus{border-color:rgba(129,216,208,.5);box-shadow:0 0 0 3px rgba(129,216,208,.08)}
    textarea.field{min-height:120px;resize:vertical}
    .label{font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:#7D9B9B;font-weight:800;margin-bottom:7px}
    .divider{height:1px;background:var(--line);margin:16px 0}
    .creator-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
    .creator-card{overflow:hidden}
    .creator-cover{height:220px;position:relative;background:#133540}
    .creator-cover img{width:100%;height:100%;object-fit:cover;display:block}
    .creator-body{padding:16px}
    .creator-name{font-family:"Barlow Condensed",Inter,"Segoe UI",Arial,sans-serif;font-size:27px;text-transform:uppercase;line-height:.95}
    .creator-handle{font-size:9px;color:var(--muted);margin-top:3px}
    .rating{color:var(--warning);font-size:11px}
    .two{grid-template-columns:1fr 1fr}
    .three{grid-template-columns:repeat(3,1fr)}
    .four{grid-template-columns:repeat(4,1fr)}
    .layout{display:grid;grid-template-columns:260px minmax(0,1fr);gap:18px}
    .sidebar{position:sticky;top:85px;height:max-content}
    .side-link{display:flex;align-items:center;gap:9px;width:100%;padding:11px 12px;background:transparent;border:1px solid transparent;color:#A9C1C1;font-size:10px;text-align:left}
    .side-link:hover,.side-link.active{background:rgba(129,216,208,.08);border-color:rgba(129,216,208,.15);color:var(--white)}
    .side-group{padding:10px 0}
    .side-title{padding:9px 12px;font-size:8px;color:#688282;letter-spacing:.18em;text-transform:uppercase;font-weight:800}
    .metric{padding:18px}
    .metric .n{font-family:"Barlow Condensed",Inter,"Segoe UI",Arial,sans-serif;font-size:40px;line-height:1}
    .metric .k{font-size:8px;letter-spacing:.15em;text-transform:uppercase;color:#6F8A8A;margin-top:6px}
    .progress{height:8px;background:#163942;border:1px solid rgba(255,255,255,.08);overflow:hidden}
    .progress > div{height:100%;background:var(--mint)}
    .timeline{display:grid;gap:10px}
    .timeline-item{display:grid;grid-template-columns:30px 1fr;gap:12px}
    .timeline-dot{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--line);background:#0A252F;color:#729090;font-size:10px}
    .timeline-item.done .timeline-dot{background:rgba(125,226,165,.12);border-color:rgba(125,226,165,.25);color:var(--success)}
    .timeline-item.current .timeline-dot{background:rgba(129,216,208,.12);border-color:rgba(129,216,208,.3);color:var(--mint)}
    .notice{padding:12px 14px;border:1px solid rgba(129,216,208,.18);background:rgba(129,216,208,.06);color:#C6DFDF;font-size:11px;line-height:1.55}
    .empty{padding:44px 18px;text-align:center;border:1px dashed rgba(255,255,255,.14);color:#7E9999}
    .table-wrap{overflow:auto}
    table{border-collapse:collapse;width:100%;min-width:720px}
    th,td{padding:12px 11px;border-bottom:1px solid var(--line);text-align:left;font-size:11px;vertical-align:top}
    th{font-size:8px;letter-spacing:.15em;text-transform:uppercase;color:#728B8B}
    .chat{display:flex;flex-direction:column;gap:10px;max-height:420px;overflow:auto;padding-right:6px}
    .msg{max-width:78%;padding:10px 12px;border:1px solid var(--line);background:#102F39;font-size:11px;line-height:1.55}
    .msg.me{margin-left:auto;background:rgba(129,216,208,.10);border-color:rgba(129,216,208,.18)}
    .msg-meta{font-size:8px;color:#6B8585;margin-top:6px}
    .modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.66);z-index:100;display:grid;place-items:center;padding:18px}
    .modal{width:min(760px,100%);max-height:90vh;overflow:auto;background:#092530;border:1px solid rgba(129,216,208,.18);box-shadow:0 30px 80px rgba(0,0,0,.4)}
    .modal-head{padding:18px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:14px;align-items:center}
    .modal-body{padding:20px}
    .toast-wrap{position:fixed;right:16px;bottom:16px;z-index:120;display:grid;gap:9px;width:min(360px,calc(100vw - 32px))}
    .toast{padding:13px 14px;background:#0B2B36;border:1px solid rgba(129,216,208,.2);box-shadow:var(--shadow);font-size:11px;line-height:1.45}
    .toast.success{border-color:rgba(125,226,165,.28)}
    .toast.error{border-color:rgba(241,138,138,.28)}
    .footer{border-top:1px solid var(--line);padding:34px 20px 44px;color:#678080;font-size:9px;letter-spacing:.10em;text-transform:uppercase}.footer-grid{display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:26px}.footer-title{color:#90A8A8;font-size:8px;letter-spacing:.16em;margin-bottom:9px}.footer-link{display:block;border:0;background:none;color:#678080;padding:4px 0;font-size:9px;letter-spacing:.10em;text-transform:uppercase;text-align:left}.footer-link:hover{color:var(--mint)}
    .language-switch{display:inline-flex;align-items:center;gap:2px;padding:2px;border:1px solid var(--line);background:rgba(255,255,255,.02);border-radius:999px;margin-right:6px}
    .language-switch button{border:0;background:transparent;color:#7f9a9c;padding:5px 7px;border-radius:999px;font-size:8px;font-weight:900;letter-spacing:.08em;cursor:pointer}
    .language-switch button.active{background:var(--mint);color:#082530}
    .mobile-menu{display:none}
    /* Compact header tabs inspired by the supplied Uiverse radio navigation. */
    .radio-inputs{position:relative;display:flex;align-items:flex-end;gap:2px;flex:0 1 auto;min-width:0;width:auto;overflow:visible!important;padding:5px 7px 0;background:rgba(129,216,208,.12);border:1px solid rgba(129,216,208,.16);border-bottom:0;border-radius:9px 9px 0 0}
    .radio-nav-item{position:relative;display:flex;align-items:center;justify-content:center;border:0;background:transparent;color:#91adad;cursor:pointer;white-space:nowrap;border-radius:8px 8px 0 0;transition:all .15s ease-in-out}
    .radio-nav-label{position:relative;z-index:1;display:flex;align-items:center;justify-content:center;gap:7px;padding:9px 12px;border-radius:8px 8px 0 0;font-size:9px;font-weight:800;letter-spacing:.09em;text-transform:uppercase}
    .radio-nav-label>i{width:14px;height:14px}
    .radio-nav-item:hover{color:#fff}
    .radio-nav-item.active{background:#eef6f1;color:#0b2a31;cursor:default}
    .radio-nav-item.active .radio-nav-label{background:#eef6f1}
    .radio-nav-item .pre-name,.radio-nav-item .pos-name{position:absolute;width:10px;height:10px;bottom:0;background:rgba(129,216,208,.12);opacity:0}
    .radio-nav-item .pre-name{right:-10px;border-bottom-left-radius:300px;box-shadow:-3px 3px 0 3px #eef6f1}
    .radio-nav-item .pos-name{left:-10px;border-bottom-right-radius:300px;box-shadow:3px 3px 0 3px #eef6f1}
    .radio-nav-item.active .pre-name,.radio-nav-item.active .pos-name{opacity:1}
    .radio-menu-wrap{position:relative;display:flex}
    .radio-menu-wrap>summary{list-style:none}
    .radio-menu-wrap>summary::-webkit-details-marker{display:none}
    .radio-menu-trigger{font:inherit}
    .radio-menu-wrap[open]>.radio-menu-trigger{background:#eef6f1;color:#0b2a31}
    .radio-menu-wrap[open] .header-menu-chevron{transform:rotate(180deg)}
    .header-menu-chevron{transition:transform .16s ease}
    .header-menu-dropdown{display:none;position:absolute;top:calc(100% + 8px);right:0;width:290px;max-height:min(70vh,560px);overflow:auto;padding:9px;background:#0A2731;border:1px solid rgba(129,216,208,.20);border-radius:8px;box-shadow:0 24px 60px rgba(0,0,0,.38);z-index:200}
    .radio-menu-wrap[open]>.header-menu-dropdown{display:block}
    @media(max-width:1240px){.radio-nav-label{padding:9px 9px;letter-spacing:.05em}.brand{min-width:180px}.header-inner{gap:10px}}

    .header-menu-wrap{position:relative;display:flex;align-items:center}
    .header-menu-trigger{display:flex;align-items:center;gap:4px}
    .header-menu-chevron{width:13px;height:13px;margin-left:2px}
    .header-menu-dropdown{position:absolute;top:calc(100% + 10px);right:0;width:280px;max-height:min(70vh,560px);overflow:auto;padding:9px;background:#0A2731;border:1px solid rgba(129,216,208,.20);border-radius:8px;box-shadow:0 24px 60px rgba(0,0,0,.38);z-index:90}
    .header-menu-title{padding:8px 10px 10px;color:#6F8E8E;font-size:8px;font-weight:900;letter-spacing:.16em;text-transform:uppercase}
    .nav-menu-item{display:flex;align-items:center;gap:10px;width:100%;padding:11px 12px;border-radius:6px;color:#B8CCCC;font-size:10px;font-weight:700;letter-spacing:.04em}
    .nav-menu-item i{width:16px;height:16px;flex:0 0 auto}
    .nav-menu-item:hover,.nav-menu-item.active{background:rgba(129,216,208,.10);color:var(--white)}
    button.nav-menu-item{border:0;background:transparent;text-align:left;cursor:pointer}
    .role-switch-action{color:var(--mint);font-weight:850}
    .complaint-media-grid{margin-top:12px}
    .complaint-media,.market-evidence-video{display:block;width:100%;height:180px;object-fit:cover;border:1px solid var(--line);background:#071e29;border-radius:6px}
    video.complaint-media,.market-evidence-video{object-fit:contain}
    @media(max-width:600px){.complaint-media,.market-evidence-video{height:150px}}
    .header-menu-divider{height:1px;background:var(--line);margin:8px 4px}
    .profile-public-link{color:var(--mint)}
    .artisan-profile-shortcut{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:16px}
    .role-badge{padding:7px 9px;border:1px solid rgba(129,216,208,.2);background:rgba(129,216,208,.08);font-size:8px;text-transform:uppercase;letter-spacing:.14em;color:var(--mint)}
    .auth-grid{display:grid;grid-template-columns:1.05fr .95fr;gap:18px}
    .auth-brand{padding:24px;background:radial-gradient(circle at 100% 0,rgba(129,216,208,.12),transparent 42%),linear-gradient(145deg,#0F3440,#082530);border:1px solid rgba(129,216,208,.12)}
    .auth-tab{flex:1;border:1px solid transparent;background:transparent;color:#84A5A6;padding:12px;font-size:9px;font-weight:900;letter-spacing:.16em;text-transform:uppercase}
    .auth-tab.active-login{background:#fff;color:#061A22}
    .auth-tab.active-register{background:var(--mint);color:#09202A}
    .social-btn{width:100%;display:flex;align-items:center;justify-content:center;gap:10px;padding:12px 14px;font-size:10px;font-weight:900;letter-spacing:.10em;text-transform:uppercase;border:1px solid var(--line)}
    .social-google{background:#fff;color:#071E29}
    .social-facebook{background:#1877F2;color:#fff;border-color:#1877F2}
    .auth-helper{font-size:9px;color:#688282;line-height:1.55}

    /* Premium sign-in / register experience */
    .auth-backdrop{z-index:900;background:rgba(2,10,15,.76);backdrop-filter:blur(14px);padding:24px}
    .auth-premium-modal{width:min(1080px,96vw);max-height:min(820px,94vh);display:grid;grid-template-columns:1.04fr .96fr;overflow:hidden;border:1px solid rgba(151,224,218,.14);border-radius:26px;background:#091e2a;box-shadow:0 42px 120px rgba(0,0,0,.58),0 0 0 1px rgba(255,255,255,.02)}
    .auth-premium-visual{position:relative;min-height:690px;overflow:hidden;background:radial-gradient(circle at 18% 18%,rgba(118,111,255,.20),transparent 27%),radial-gradient(circle at 78% 35%,rgba(129,216,208,.18),transparent 28%),linear-gradient(145deg,#100d2a 0%,#102f42 52%,#092630 100%)}
    .auth-premium-visual:after{content:"";position:absolute;inset:auto -18% -34% 10%;height:65%;background:radial-gradient(ellipse at center,rgba(129,216,208,.13),transparent 64%);filter:blur(12px)}
    .auth-space-grid{position:absolute;inset:0;opacity:.25;background-image:linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px);background-size:44px 44px;mask-image:linear-gradient(to bottom,black,transparent 85%)}
    .auth-space-grid:after{content:"";position:absolute;inset:0;background-image:radial-gradient(circle at 12% 22%,#fff 0 1px,transparent 1.5px),radial-gradient(circle at 34% 13%,#fff 0 1px,transparent 1.5px),radial-gradient(circle at 68% 25%,#fff 0 1.2px,transparent 1.8px),radial-gradient(circle at 84% 14%,#fff 0 1px,transparent 1.5px),radial-gradient(circle at 74% 51%,#fff 0 1px,transparent 1.5px),radial-gradient(circle at 22% 58%,#fff 0 1px,transparent 1.5px);opacity:.6}
    .auth-planet{position:absolute;display:block;border-radius:50%;pointer-events:none}
    .auth-planet-large{width:330px;height:330px;left:-82px;top:82px;background:radial-gradient(circle at 68% 30%,rgba(184,219,255,.94),rgba(71,107,182,.95) 42%,rgba(35,42,105,.98) 71%);box-shadow:inset -36px -26px 58px rgba(16,13,65,.48),0 0 90px rgba(113,147,255,.18)}
    .auth-planet-large:after{content:"";position:absolute;inset:30px;border-radius:50%;background:radial-gradient(ellipse at 32% 24%,rgba(255,255,255,.18),transparent 36%),radial-gradient(ellipse at 70% 68%,rgba(40,56,131,.38),transparent 35%)}
    .auth-planet-small{width:92px;height:92px;left:172px;top:330px;background:radial-gradient(circle at 34% 28%,#c6b6ff,#7157bd 48%,#332562 78%);box-shadow:0 0 55px rgba(151,111,255,.24)}
    .auth-planet-glow{width:132px;height:132px;right:62px;top:186px;background:radial-gradient(circle at 35% 30%,#c9f3ed,#60b6bf 42%,#315078 76%);box-shadow:0 0 78px rgba(129,216,208,.20)}
    .auth-orbit{position:absolute;border:1px solid rgba(192,203,255,.17);border-radius:50%;transform:rotate(-18deg);pointer-events:none}
    .auth-orbit-one{width:510px;height:185px;left:-90px;top:218px}
