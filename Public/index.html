function clone(v){ return JSON.parse(JSON.stringify(v)); }
function normalizeState(input){
  const base=clone(SEED);
  const source=(input&&typeof input==='object')?input:{};
  const out={...base,...source};
  out.user={...base.user,...(source.user||{})};
  out.session={...base.session,...(source.session||{})};
  const collections=['artisans','requests','projects','notifications','savedCreators','vouchers'];
  for(const key of collections){
    if(!Array.isArray(source[key])) out[key]=clone(base[key]||[]);
  }
  return out;
}
function loadState(){
  try{ const raw=localStorage.getItem(CONFIG.storageKey); if(raw) return normalizeState(JSON.parse(raw)); }catch(e){}
  return clone(SEED);
}
function save(){ try{ localStorage.setItem(CONFIG.storageKey, JSON.stringify(state)); refreshShell(); return true; }catch(e){ if(e?.name==='QuotaExceededError'||e?.code===22){ toast('Storage is full. Uploaded media is stored separately; please reload the page and try again.','warning'); return false; } throw e; } }

  const cls=(s==='approved'||s==='released'||s==='confirmed'||s==='completed')?'pill-success':(s==='submitted'||s==='proposal_received'||s==='in_production'||s==='customer_reported')?'pill-mint':(s==='awaiting_payment'||s==='pending')?'pill-warning':'pill';

const I18N_EN=Object.fromEntries(Object.entries(I18N.vi).map(([en,vi])=>[vi,en]));
function t(value){
  const s=String(value??'');
  if(currentLanguage==='en') return I18N_EN[s] ?? s;
  return I18N.vi[s] ?? s;
}
function setLanguage(lang){
  currentLanguage=lang==='vi'?'vi':'en';
  try{localStorage.setItem(I18N_STORAGE_KEY,currentLanguage);}catch(e){}
  document.documentElement.lang=currentLanguage;
  refreshShell();
  applyLanguage();
  if(document.getElementById('app')?.innerHTML) applyLanguage();
  toast(currentLanguage==='vi'?'ÄÃ£ chuyá»ƒn sang tiáº¿ng Viá»‡t.':'Switched to English.','success');
}
function applyLanguage(){
  if(typeof document==='undefined') return;
  const root=document.body;
  const skip=new Set(['SCRIPT','STYLE','NOSCRIPT']);
  const walker=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);
  const nodes=[];
  let node;
  while(node=walker.nextNode()){
    if(skip.has(node.parentElement?.tagName)) continue;
    const raw=node.nodeValue;
    const trimmed=raw.trim();
    if(!trimmed) continue;
    nodes.push({node,raw,trimmed});
  }
  nodes.forEach(({node,raw,trimmed})=>{
    const translated=t(trimmed);
    if(translated!==trimmed){
      node.nodeValue=raw.replace(trimmed,translated);
    }
  });
  document.querySelectorAll('[placeholder],[title],[aria-label]').forEach(el=>{
    for(const attr of ['placeholder','title','aria-label']){
      if(el.hasAttribute(attr)){
        const val=el.getAttribute(attr)||''; const translated=t(val); if(translated!==val) el.setAttribute(attr,translated);
      }
    }
  });
  document.documentElement.lang=currentLanguage;
}
const I18NObserver=new MutationObserver(()=>{ if(!window.__i18nApplying){ window.__i18nApplying=true; requestAnimationFrame(()=>{try{applyLanguage();}finally{window.__i18nApplying=false;}}); } });
function initI18N(){
  document.documentElement.lang=currentLanguage;
  I18NObserver.observe(document.body,{childList:true,subtree:true});
  applyLanguage();
}

const FILE_DB_NAME='dioralink_attachment_store_v1';
const FILE_DB_VERSION=1;
const FILE_STORE='blobs';
function openFileDB(){return new Promise((resolve,reject)=>{if(!('indexedDB' in window)){reject(new Error('File storage is unavailable in this browser.'));return;}const req=indexedDB.open(FILE_DB_NAME,FILE_DB_VERSION);req.onupgradeneeded=()=>{const db=req.result;if(!db.objectStoreNames.contains(FILE_STORE))db.createObjectStore(FILE_STORE,{keyPath:'id'});};req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error||new Error('Unable to open file storage.'));});}
async function storeBinaryFile(file,scope='project'){const id=`ATT-${scope}-${Date.now()}-${Math.random().toString(36).slice(2,8)}`;const db=await openFileDB();await new Promise((resolve,reject)=>{const tx=db.transaction(FILE_STORE,'readwrite');tx.objectStore(FILE_STORE).put({id,blob:file,name:file.name,size:file.size,type:file.type||'application/octet-stream',createdAt:new Date().toISOString()});tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error||new Error('Unable to save file.'));});db.close();return{id,name:file.name,size:file.size,type:file.type||'application/octet-stream',createdAt:new Date().toISOString()};}
function mediaAttrs(value,fallback=''){
  const v=String(value||'');
  if(v.startsWith('asset:')) return `src="${esc(fallback)}" data-media-id="${esc(v.slice(6))}"`;
  return `src="${esc(v||fallback)}"`;
}
const mediaUrlCache=new Map();
async function hydrateMediaAssets(){
  const nodes=[...document.querySelectorAll('[data-media-id]')];
  for(const node of nodes){
    const id=node.getAttribute('data-media-id'); if(!id) continue;
    try{
      let url=mediaUrlCache.get(id);
      if(!url){
        const db=await openFileDB();
        const record=await new Promise((resolve,reject)=>{const tx=db.transaction(FILE_STORE,'readonly');const req=tx.objectStore(FILE_STORE).get(id);req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error);});
        db.close();
        if(record?.blob){url=URL.createObjectURL(record.blob);mediaUrlCache.set(id,url);}
      }
      if(url) node.src=url;
    }catch(e){ /* keep fallback */ }
  }
}
async function migrateEmbeddedMedia(){
  const tasks=[];
  const add=(obj,field,scope,fallback)=>{
    if(!obj)return; const value=obj[field];
    if(typeof value==='string' && value.startsWith('data:image/')){
      tasks.push((async()=>{try{
        const blob=await (await fetch(value)).blob();
        const rec=await storeBinaryFile(new File([blob],`${scope}.img`,{type:blob.type||'image/jpeg'}),scope);
        obj[`${field}AssetId`]=rec.id; obj[`${field}Fallback`]=fallback||''; obj[field]=`asset:${rec.id}`;
      }catch(e){} })());
    }
  };
  add(state.user,'avatar','avatar',GUEST_USER.avatar);
  (state.artisans||[]).forEach((a,i)=>{
    add(a,'avatar',`artisan-avatar-${i}`,a.avatar&&a.avatar.startsWith('http')?a.avatar:GUEST_USER.avatar);
    add(a,'hero',`artisan-hero-${i}`,a.hero&&a.hero.startsWith('http')?a.hero:'');
    if(Array.isArray(a.portfolio)) a.portfolio=a.portfolio.map((v,j)=>{
      if(typeof v==='string' && v.startsWith('data:image/')){
        const holder={v}; tasks.push((async()=>{try{const blob=await (await fetch(v)).blob();const rec=await storeBinaryFile(new File([blob],`portfolio-${i}-${j}.img`,{type:blob.type||'image/jpeg'}),'portfolio'); holder.v=`asset:${rec.id}`;}catch(e){} })()); return holder;}
      return {v};
    }).map(x=>x.v);
    add(a.paymentProfile,'qrImage',`artisan-qr-${i}`,a.paymentProfile?.qrImage?.startsWith('http')?a.paymentProfile.qrImage:'');
  });
  if(tasks.length){await Promise.all(tasks);try{localStorage.setItem(CONFIG.storageKey,JSON.stringify(state));}catch(e){/* migrated media may still be constrained by unrelated data */}}
}

async function markDirectPayment(e,projectId,milestoneId){
  e.preventDefault(); if(!requireRole('customer'))return; const p=projectById(projectId); const m=p?.milestones.find(x=>x.id===milestoneId); if(!p||!m)return;
  const calc=milestonePayable(p,m); const fd=new FormData(e.target); const ref=String(fd.get('transferReference')||'').trim(); const proofFile=fd.get('proof');
  if(!ref){toast('Enter the transfer reference.','warning');return;}
  let proof=null; if(proofFile&&proofFile.size){if(proofFile.size>5*1024*1024){toast('Payment proof must be 5MB or smaller.','error');return;}proof=await storeBinaryFile(proofFile,'payment-proof');}
  const record={milestoneId,amount:m.amount,customerPaid:calc.total,discount:calc.discount,voucherCode:calc.code,status:'customer_reported',paidAt:new Date().toISOString(),confirmedAt:null,transferReference:ref,proof};
  const existing=p.payments.find(x=>x.milestoneId===milestoneId); if(existing)Object.assign(existing,record);else p.payments.push(record);
  p.activity.unshift({text:`Customer reported direct payment for ${milestoneId}`,time:dateTime(new Date())}); addNotification({title:'Payment reported',body:`Customer reported a direct payment for ${m.name}.`,route:`artisan-project/${p.id}`}); p.appliedVoucher=null; save(); closeModal(); toast('Payment reported to the artisan.','success'); render();
}

async function compressAvatarFile(file){
  return new Promise((resolve,reject)=>{
    const reader=new FileReader();
    reader.onload=()=>{
      const img=new Image();
      img.onload=()=>{
        const maxSize=800;
        let width=img.width;
        let height=img.height;
        if(width>maxSize||height>maxSize){
          const scale=Math.min(maxSize/width,maxSize/height);
          width=Math.round(width*scale);
          height=Math.round(height*scale);
        }
        const canvas=document.createElement('canvas');
        canvas.width=width;
        canvas.height=height;
        const ctx=canvas.getContext('2d');
        if(!ctx){reject(new Error('Unable to process avatar image.'));return;}
        ctx.fillStyle='#ffffff';
        ctx.fillRect(0,0,width,height);
        ctx.drawImage(img,0,0,width,height);
        resolve(canvas.toDataURL('image/jpeg',0.82));
      };
      img.onerror=()=>reject(new Error('Unable to read avatar image.'));
      img.src=reader.result;
    };
    reader.onerror=()=>reject(new Error('Unable to read avatar file.'));
    reader.readAsDataURL(file);
  });
}

  const fd=new FormData(e.target);
  const submit=e.target.querySelector("button[type='submit']");
  if(submit){submit.disabled=true;submit.textContent='Saving...';}
  try{
    const name=String(fd.get('name')||'').trim();
    const phone=String(fd.get('phone')||'').trim();
    const city=String(fd.get('city')||'').trim();
    const bio=String(fd.get('bio')||'').trim();
    if(!name)throw new Error('Name is required.');
    let avatar=state.user.avatar||GUEST_USER.avatar;
    const avatarFile=fd.get('avatarFile');
    if(avatarFile&&avatarFile.size){
      if(!avatarFile.type.startsWith('image/'))throw new Error('Avatar must be an image.');
      if(avatarFile.size>3*1024*1024)throw new Error('Avatar must be 3MB or smaller.');
      avatar=await compressAvatarFile(avatarFile);
    }
    const res=await fetch(apiURL('/api/auth/profile'),{
      method:'PUT',
      headers:{'Content-Type':'application/json'},
      credentials:'include',
      body:JSON.stringify({name,phone,city,bio,avatar})
    });
    const raw=await res.text();
    let data={};
    try{data=raw?JSON.parse(raw):{};}catch{}
    if(!res.ok){
      console.error('Profile API error:',res.status,raw);
      throw new Error(data.message||`Profile update failed (HTTP ${res.status}).`);
    }
    const user=data.user||{};
    state.user={...state.user,...user,authenticated:true};
    state.session={authenticated:true,userId:state.user.id};
    save();
    toast('Profile updated.','success');
    render();
  }catch(error){
    console.error('saveProfile error:',error);
    toast(error.message||'Unable to update profile.','error');
  }finally{
    if(submit){submit.disabled=false;submit.textContent='Save changes';}
  }
}

function startMilestone(projectId,milestoneId){const p=projectById(projectId);const m=p?.milestones.find(x=>x.id===milestoneId);if(!p||!m||m.status!=='pending')return;const idx=p.milestones.findIndex(x=>x.id===milestoneId);if(idx>0){const prev=p.milestones[idx-1];const prevPay=p.payments.find(x=>x.milestoneId===prev.id);if(prevPay?.status!=='confirmed'){toast('Confirm the previous milestone payment before starting this stage.','warning');return;}}m.status='in_progress';p.status='in_production';p.currentMilestone=p.milestones.findIndex(x=>x.id===m.id)+1;p.activity.unshift({text:`Artisan started ${m.id}`,time:dateTime(new Date())});save();toast('Milestone started.','success');render();}
function submitMilestone(projectId,milestoneId){const p=projectById(projectId);const m=p?.milestones.find(x=>x.id===milestoneId);const input=document.getElementById('ev-'+milestoneId);if(!p||!m||m.status!=='in_progress'||!input?.value.trim()){toast('Add progress evidence before submitting.','error');return;}m.status='submitted';m.evidence=input.value.trim();p.status='waiting_customer';p.activity.unshift({text:`Artisan submitted ${m.id} for approval`,time:dateTime(new Date())});addNotification({title:'Milestone submitted',body:`${m.name} Ä‘ang chá» Customer approval.`,route:`project/${p.id}`});save();toast('Sent for review.','success');render();}

async function saveArtisanProfile(e,aid){e.preventDefault();const a=artisanById(aid);if(!a)return;const fd=new FormData(e.target);a.name=String(fd.get('name')).trim();a.handle=String(fd.get('handle')).trim();a.city=String(fd.get('city')).trim();a.bio=String(fd.get('bio')).trim();a.startingPrice=Number(fd.get('startingPrice'));a.response=String(fd.get('response')).trim();a.specialties=String(fd.get('specialties')).split(',').map(x=>x.trim()).filter(Boolean);const avatarFile=fd.get('avatarFile');const heroFile=fd.get('heroFile');try{if(avatarFile&&avatarFile.size){if(!avatarFile.type.startsWith('image/'))throw new Error('Avatar must be an image.');if(avatarFile.size>5*1024*1024)throw new Error('Avatar must be 5MB or smaller.');const oldAvatar=a.avatar;const rec=await storeBinaryFile(avatarFile,'artisan-avatar');a.avatar=`asset:${rec.id}`;a.avatarFallback=(typeof oldAvatar==='string'&&oldAvatar.startsWith('http'))?oldAvatar:GUEST_USER.avatar;}if(heroFile&&heroFile.size){if(heroFile.size>5*1024*1024)throw new Error('Cover image must be 5MB or smaller.');const oldHero=a.hero;const rec=await storeBinaryFile(heroFile,'artisan-hero');a.hero=`asset:${rec.id}`;a.heroFallback=(typeof oldHero==='string'&&oldHero.startsWith('http'))?oldHero:'';}state.user.name=a.name;state.user.city=a.city;state.user.bio=a.bio;state.user.avatar=a.avatar||state.user.avatar;state.user.avatarFallback=a.avatarFallback||state.user.avatarFallback||GUEST_USER.avatar;save();toast('Profile published.','success');render();}catch(err){toast(err.message||'Unable to update profile.','error');}}
async function savePaymentSettings(aid){
  if(!requireRole('artisan'))return; const a=artisanById(aid); if(!a)return; const bank=document.querySelector('[name="paymentBankName"]')?.value.trim()||''; const holder=document.querySelector('[name="paymentAccountName"]')?.value.trim()||''; const number=document.querySelector('[name="paymentAccountNumber"]')?.value.trim()||''; const file=document.querySelector('[name="paymentQRFile"]')?.files?.[0]; const qrUrl=document.querySelector('[name="paymentQRUrl"]')?.value.trim()||'';
  if(!a.paymentProfile)a.paymentProfile={method:'vietqr',bankName:'',accountName:'',accountNumber:'',qrImage:''}; a.paymentProfile.bankName=bank;a.paymentProfile.accountName=holder;a.paymentProfile.accountNumber=number;
  if(file){if(file.size>5*1024*1024){toast('QR image must be 5MB or smaller.','error');return;}const oldQR=a.paymentProfile.qrImage;const rec=await storeBinaryFile(file,'artisan-qr');a.paymentProfile.qrImage=`asset:${rec.id}`;a.paymentProfile.qrImageFallback=(typeof oldQR==='string'&&oldQR.startsWith('http'))?oldQR:'';}else if(qrUrl)a.paymentProfile.qrImage=qrUrl;a.paymentProfile.qrImageFallback=a.paymentProfile.qrImageFallback||'';
  save();toast('Payment details saved.','success');render();
}
function clearPaymentQR(aid){if(!requireRole('artisan'))return;const a=artisanById(aid);if(!a?.paymentProfile)return;a.paymentProfile.qrImage='';save();toast('Payment QR removed.','success');render();}
function readFileDataUrl(file){return new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=reject;r.readAsDataURL(file);});}
async function addPortfolioImage(aid){const input=document.getElementById('portfolio-upload');const f=input?.files?.[0];const a=artisanById(aid);if(!f||!a)return;if(f.size>5*1024*1024){toast('Portfolio image must be 5MB or smaller.','error');return;}const rec=await storeBinaryFile(f,'portfolio');a.portfolio=a.portfolio||[];a.portfolio.push(`asset:${rec.id}`);a.portfolioFallback=a.portfolioFallback||[];a.portfolioFallback.push('');save();toast('Portfolio updated.','success');render();}
function removePortfolioImage(aid,index){const a=artisanById(aid);if(!a)return;a.portfolio.splice(index,1);save();toast('Portfolio updated.','success');render();}
function renderArtisanEarnings(){const list=artisanProjects();const confirmed=list.flatMap(p=>p.payments||[]).filter(x=>x.status==='confirmed');const total=confirmed.reduce((s,x)=>s+(x.customerPaid||x.amount||0),0);const pending=list.flatMap(p=>p.milestones.map(m=>({m,pay:p.payments.find(x=>x.milestoneId===m.id)}))).filter(x=>x.m.status==='approved'&&x.pay?.status!=='confirmed').reduce((s,x)=>s+x.m.amount,0);document.getElementById('app').innerHTML=`<section class="page"><div class="section-head"><div><div class="eyebrow">Finance</div><div class="section-title">EARNINGS</div></div></div><div class="grid three"><div class="card metric"><div class="n">${money(total)}</div><div class="k">Released</div></div><div class="card metric"><div class="n">${money(pending)}</div><div class="k">Pending</div></div><div class="card metric"><div class="n">${list.length}</div><div class="k">Projects</div></div></div><div class="card pad" style="margin-top:16px"><div class="eyebrow">Transaction history</div><div class="table-wrap" style="margin-top:10px"><table><thead><tr><th>Project</th><th>Milestone</th><th>Amount</th><th>Status</th><th>Date</th></tr></thead><tbody>${list.flatMap(p=>p.milestones.map(m=>{const pay=p.payments.find(x=>x.milestoneId===m.id);return `<tr><td>${esc(p.title)}</td><td>${esc(m.name)}</td><td>${money(m.amount)}</td><td>${pill(pay?.status||'pending')}</td><td>${pay?.confirmedAt?dateOnly(pay.confirmedAt):'â€”'}</td></tr>`})).join('')}</tbody></table></div></div></section>`;}

fy({name,email,password,role:authRegisterRole})});const data=await res.json().catch(()=>({}));if(!res.ok)throw new Error(data.message||'ÄÄƒng kÃ½ tháº¥t báº¡i.');const u=data.session?.user||data.user||{};state.user={...state.user,...u,authenticated:true,provider:'email'};state.session={authenticated:true,userId:state.user.id};save();closeModal();toast('Account created.','success');navigate(roleAfterLogin(state.user.role||authRegisterRole));}catch(error){toast(error.message||'KhÃ´ng thá»ƒ táº¡o tÃ i khoáº£n.','warning');}finally{if(submit){submit.disabled=false;submit.textContent=`Create ${authRegisterRole==='artisan'?'Artisan':'Customer'} account`;}}}

async function submitPasswordReset(e){e.preventDefault();const email=e.target.email.value.trim().toLowerCase();try{if(CONFIG.demoMode){closeModal();toast('Password reset link sent.','success');return;}const res=await fetch(apiURL('/api/auth/forgot-password'),{method:'POST',headers:{'Content-Type':'application/json'},credentials:'include',body:JSON.stringify({email})});if(!res.ok)throw new Error('Unable to send reset link.');closeModal();toast('Password reset link sent.','success');}catch(err){toast(err.message,'warning');}}

function loginGoogle(){if(CONFIG.demoMode){authSocial('google');return;}const clientId=CONFIG.googleClientId;if(!clientId||clientId.includes('YOUR_GOOGLE')){toast('ChÆ°a cáº¥u hÃ¬nh Google Client ID.','warning');return;}if(!window.google?.accounts?.id){toast('Google Identity Services chÆ°a sáºµn sÃ ng.','warning');return;}window.google.accounts.id.initialize({client_id:clientId,callback:handleGoogleCredential});window.google.accounts.id.prompt();}
async function handleGoogleCredential(response){try{const result=await fetch(apiURL('/api/auth/google'),{method:'POST',credentials:'include',headers:{'Content-Type':'application/json'},body:JSON.stringify({credential:response.credential,role:authMode==='register'?authRegisterRole:authLoginRole})});const data=await result.json().catch(()=>({}));if(!result.ok)throw new Error(data.message||'Google authentication failed');const u=data.session?.user||data.user||{};state.user={...state.user,...u,authenticated:true,provider:'google'};state.session={authenticated:true,userId:state.user.id};save();closeModal();toast('Signed in with Google.','success');navigate(roleAfterLogin(state.user.role||authRegisterRole));}catch(error){toast(error.message||'Google authentication failed','warning');}}
function loginFacebook(){if(CONFIG.demoMode){authSocial('facebook');return;}if(!CONFIG.facebookAppId||CONFIG.facebookAppId.includes('YOUR_FACEBOOK')){toast('ChÆ°a cáº¥u hÃ¬nh Facebook App ID.','warning');return;}if(!window.FB){toast('Facebook SDK chÆ°a sáºµn sÃ ng.','warning');return;}FB.login(async response=>{if(!response?.authResponse){toast('Facebook login Ä‘Ã£ bá»‹ huá»·.','warning');return;}try{const result=await fetch(apiURL('/api/auth/facebook'),{method:'POST',credentials:'include',headers:{'Content-Type':'application/json'},body:JSON.stringify({accessToken:response.authResponse.accessToken,role:authMode==='register'?authRegisterRole:authLoginRole})});const data=await result.json().catch(()=>({}));if(!result.ok)throw new Error(data.message||'Facebook authentication failed');const u=data.session?.user||data.user||{};state.user={...state.user,...u,authenticated:true,provider:'facebook'};state.session={authenticated:true,userId:state.user.id};save();closeModal();toast('Signed in with Facebook.','success');navigate(roleAfterLogin(state.user.role||authRegisterRole));}catch(error){toast(error.message||'Facebook authentication failed','warning');}}, {scope:'public_profile,email'});}
async function restoreSession(){if(CONFIG.demoMode)return;try{const res=await fetch(apiURL('/api/auth/me'),{method:'GET',credentials:'include'});if(res.ok){const data=await res.json();if(data.user){state=normalizeState({...state,user:{...state.user,...data.user,authenticated:true},session:{authenticated:true,userId:data.user.id}});save();}}else if(res.status===401){setGuest();}}catch(e){console.warn('Session restore failed:',e.message);}}
async function logout(){let serverError='';try{if(!CONFIG.demoMode){const res=await fetch(apiURL('/api/auth/logout'),{method:'POST',credentials:'include'});if(!res.ok){const data=await res.json().catch(()=>({}));serverError=data.message||`Logout failed (HTTP ${res.status}).`;}}}catch(error){serverError=error?.message||'Logout request failed.';}finally{setGuest();closeModal();navigate('home');toast(serverError?'Signed out on this device.':'Signed out.','success');}}
function getVoucher(code){const normalized=String(code||'').trim().toUpperCase();return(state.vouchers||[]).find(v=>v.code===normalized);}
function voucherDiscount(voucher,amount){if(!voucher)return 0;let discount=voucher.type==='percent'?Math.round(amount*voucher.value/100):Number(voucher.value||0);if(voucher.maxDiscount)discount=Math.min(discount,voucher.maxDiscount);return Math.max(0,Math.min(discount,amount));}
function applyVoucher(projectId,milestoneId){if(!requireRole('customer'))return;const p=projectById(projectId);const input=document.getElementById(`voucher-${projectId}-${milestoneId}`);const m=p?.milestones.find(x=>x.id===milestoneId);const v=getVoucher(input?.value);if(!p||!m||!v){toast('MÃ£ voucher khÃ´ng há»£p lá»‡.','error');return;}if(m.amount<v.minSpend){toast(`Voucher yÃªu cáº§u tá»‘i thiá»ƒu ${money(v.minSpend)}.` ,'warning');return;}const discount=voucherDiscount(v,m.amount);p.appliedVoucher={code:v.code,milestoneId,discount,appliedAt:new Date().toISOString()};p.activity.unshift({text:`Voucher ${v.code} applied to ${milestoneId}`,time:dateTime(new Date())});save();toast(`Voucher applied: -${money(discount)}.`,'success');render();}
function removeVoucher(projectId){if(!requireRole('customer'))return;const p=projectById(projectId);if(!p)return;p.appliedVoucher=null;save();toast('Voucher removed.','success');render();}
function milestonePayable(p,m){const v=p.appliedVoucher?.milestoneId===m.id?getVoucher(p.appliedVoucher.code):null;const discount=v?voucherDiscount(v,m.amount):0;return{discount,total:Math.max(0,m.amount-discount),code:v?.code||null};}
function openVoucherInfo(){document.getElementById('modal-root').innerHTML=`<div class="modal-backdrop" onclick="closeModal(event)"><div class="modal" onclick="event.stopPropagation()"><div class="modal-head"><div><div class="eyebrow">Promotions</div><b>Available vouchers</b></div><button class="icon-btn" onclick="closeModal()"><i data-lucide="x"></i></button></div><div class="modal-body">${(state.vouchers||[]).map(v=>`<div class="card-soft pad" style="margin-bottom:9px"><div class="between"><b class="voucher-code">${esc(v.code)}</b><span class="pill pill-mint">Voucher</span></div><div class="small" style="margin-top:6px">${esc(v.description)}</div><div class="tiny muted" style="margin-top:5px">Minimum spend: ${money(v.minSpend)}</div></div>`).join('')}</div></div></div>`;lucide.createIcons();}

restoreSession().finally(()=>render()); migrateEmbeddedMedia().catch(e=>console.warn('Media migration skipped:',e.message));

initI18N();
</script>
