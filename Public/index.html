<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>DioraLink — Miniature Commission Ecosystem</title>

<meta
  name="description"
  content="DioraLink — Specialized marketplace for custom diorama, miniature art and collectible commissions."
>

<!-- =========================================================
     FONTS
========================================================= -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link
  href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700;800;900&display=swap"
  rel="stylesheet"
>

<!-- =========================================================
     ICONS
========================================================= -->
<script src="https://unpkg.com/lucide@latest"></script>

<!-- =========================================================
     GOOGLE IDENTITY SERVICES
========================================================= -->
<script
  src="https://accounts.google.com/gsi/client"
  async
  defer>
</script>

<!-- =========================================================
     FACEBOOK SDK
========================================================= -->
<div id="fb-root"></div>

<script>
window.fbAsyncInit = function() {

  if (!window.DIORALINK_CONFIG?.facebookAppId) return;

  FB.init({
    appId: window.DIORALINK_CONFIG.facebookAppId,
    cookie: true,
    xfbml: true,
    version: 'v26.0'
  });

};
</script>

<script
  async
  defer
  crossorigin="anonymous"
  src="https://connect.facebook.net/en_US/sdk.js">
</script>

<!-- =========================================================
     CONFIG
========================================================= -->
<script>

window.DIORALINK_CONFIG = {

  /*
   * Backend base URL.
   *
   * Same domain:
   * ""
   *
   * Local backend:
   * "http://localhost:3000"
   */

  apiBase: "",


  /*
   * Replace with real Google Client ID.
   */

  googleClientId:
    "YOUR_GOOGLE_CLIENT_ID.apps.googleusercontent.com",


  /*
   * Replace with real Facebook App ID.
   */

  facebookAppId:
    "YOUR_FACEBOOK_APP_ID",


  /*
   * Current frontend release.
   */

  version: "V1.0",


  /*
   * Feature availability.
   */

  features: {

    marketplace:
      false,

    community:
      false,

    disputes:
      false,

    aiMatching:
      false,

    creatorSubscriptions:
      false,

    advancedAnalytics:
      false,

    realtimeNotifications:
      false,

    dynamicTrust:
      false

  }

};

</script>

<!-- =========================================================
     TAILWIND
========================================================= -->
<script src="https://cdn.tailwindcss.com"></script>

<script>

tailwind.config = {

  theme: {

    extend: {

      colors: {

        dl: {

          black:
            "#071E29",

          panel:
            "#0C2A35",

          panel2:
            "#103640",

          red:
            "#81D8D0",

          redDark:
            "#4FA8A1",

          white:
            "#F9FFFF",

          muted:
            "#91B0B0",

          border:
            "rgba(255,255,255,.10)"

        }

      },

      fontFamily: {

        body:
          ["Inter", "sans-serif"],

        display:
          ["Barlow Condensed", "sans-serif"]

      }

    }

  }

};

</script>

<!-- =========================================================
     CUSTOM CSS
========================================================= -->
<style>

:root {

  --bg:
    #071E29;

  --panel:
    #0C2A35;

  --panel2:
    #103640;

  --panel3:
    #16404B;

  --red:
    #81D8D0;

  --red-dark:
    #4FA8A1;

  --white:
    #F9FFFF;

  --muted:
    #91B0B0;

  --muted2:
    #708F91;

  --line:
    rgba(255,255,255,.09);

  --line2:
    rgba(255,255,255,.16);

  --green:
    #C9F7F0;

  --yellow:
    #81D8D0;

  --violet:
    #3E6C7A;

}


/* =========================================================
   RESET
========================================================= */

* {

  box-sizing:
    border-box;

}

html {

  scroll-behavior:
    smooth;

}

body {

  margin:
    0;

  min-height:
    100vh;

  background:

    radial-gradient(
      circle at 20% 0%,
      rgba(129,216,208,.07),
      transparent 30%
    ),

    radial-gradient(
      circle at 90% 20%,
      rgba(255,255,255,.025),
      transparent 25%
    ),

    var(--bg);

  color:
    var(--white);

  font-family:
    "Inter",
    sans-serif;

  overflow-x:
    hidden;

}


/* =========================================================
   SCROLLBAR
========================================================= */

::-webkit-scrollbar {

  width:
    7px;

}

::-webkit-scrollbar-track {

  background:
    #061923;

}

::-webkit-scrollbar-thumb {

  background:
    #446A70;

}

::-webkit-scrollbar-thumb:hover {

  background:
    var(--red);

}


/* =========================================================
   GLOBAL
========================================================= */

button {

  font-family:
    inherit;

}

button:disabled {

  cursor:
    not-allowed;

  opacity:
    .5;

}

.hide {

  display:
    none !important;

}


/* =========================================================
   TYPOGRAPHY
========================================================= */

.display {

  font-family:
    "Barlow Condensed",
    sans-serif;

  font-weight:
    800;

  text-transform:
    uppercase;

  line-height:
    .88;

  letter-spacing:
    -.035em;

}

.label {

  font-size:
    9px;

  font-weight:
    900;

  text-transform:
    uppercase;

  letter-spacing:
    .17em;

  color:
    var(--red);

}

.body-copy {

  color:
    #AFCBCA;

  font-size:
    13px;

  line-height:
    1.9;

}


/* =========================================================
   ANGULAR SHAPE
========================================================= */

.angular {

  clip-path:
    polygon(
      0 0,
      calc(100% - 20px) 0,
      100% 20px,
      100% 100%,
      20px 100%,
      0 calc(100% - 20px)
    );

}


/* =========================================================
   PANELS
========================================================= */

.panel {

  background:
    linear-gradient(
      145deg,
      #103640,
      #0A2530
    );

  border:
    1px solid var(--line);

}

.panel:hover {

  border-color:
    rgba(129,216,208,.38);

}

.panel-red {

  background:

    linear-gradient(
      135deg,
      rgba(129,216,208,.14),
      rgba(15,15,15,.98)
    );

  border:
    1px solid
    rgba(129,216,208,.25);

}


/* =========================================================
   NAVIGATION
========================================================= */

.dl-header {

  position:
    fixed;

  top:
    0;

  left:
    0;

  right:
    0;

  height:
    74px;

  z-index:
    100;

  background:
    rgba(5,5,5,.97);

  border-bottom:
    1px solid var(--line);

  backdrop-filter:
    blur(14px);

}


.nav-button {

  position:
    relative;

  height:
    74px;

  display:
    inline-flex;

  align-items:
    center;

  padding:
    0 15px;

  color:
    #91AFB1;

  font-size:
    9px;

  font-weight:
    900;

  text-transform:
    uppercase;

  letter-spacing:
    .1em;

  transition:
    .2s;

}

.nav-button:hover {

  color:
    white;

}

.nav-button.active {

  color:
    white;

}

.nav-button.active::after {

  content:
    "";

  position:
    absolute;

  left:
    10px;

  right:
    10px;

  bottom:
    0;

  height:
    3px;

  background:
    var(--red);

}


/* =========================================================
   BUTTONS
========================================================= */

.btn-red {

  display:
    inline-flex;

  align-items:
    center;

  justify-content:
    center;

  gap:
    8px;

  padding:
    13px 18px;

  border:
    1px solid
    var(--red);

  background:
    var(--red);

  color:
    white;

  font-size:
    9px;

  font-weight:
    900;

  text-transform:
    uppercase;

  letter-spacing:
    .1em;

  transition:
    .2s;

}

.btn-red:hover {

  background:
    #9AE7DF;

  box-shadow:
    0 0 30px
    rgba(129,216,208,.2);

}

.btn-outline {

  display:
    inline-flex;

  align-items:
    center;

  justify-content:
    center;

  gap:
    8px;

  padding:
    12px 17px;

  border:
    1px solid var(--line2);

  background:
    transparent;

  color:
    #D7EEEC;

  font-size:
    9px;

  font-weight:
    900;

  text-transform:
    uppercase;

  letter-spacing:
    .1em;

  transition:
    .2s;

}

.btn-outline:hover {

  background:
    white;

  color:
    black;

}


/* =========================================================
   BADGE
========================================================= */

.badge {

  display:
    inline-flex;

  align-items:
    center;

  gap:
    5px;

  padding:
    6px 9px;

  border:
    1px solid var(--line);

  font-size:
    8px;

  font-weight:
    900;

  letter-spacing:
    .1em;

  text-transform:
    uppercase;

}

.badge-red {

  background:
    var(--red);

  border-color:
    var(--red);

  color:
    white;

}

.badge-v2 {

  color:
    var(--yellow);

  background:
    rgba(129,216,208,.08);

  border-color:
    rgba(129,216,208,.2);

}

.badge-v3 {

  color:
    var(--violet);

  background:
    rgba(62,108,122,.08);

  border-color:
    rgba(62,108,122,.2);

}

.badge-green {

  color:
    var(--green);

  border-color:
    rgba(201,247,240,.22);

  background:
    rgba(201,247,240,.07);

}


/* =========================================================
   IMAGES
========================================================= */

.image {

  position:
    relative;

  overflow:
    hidden;

}

.image img {

  width:
    100%;

  height:
    100%;

  object-fit:
    cover;

  filter:
    contrast(1.05)
    saturate(.9);

  transition:
    transform .7s cubic-bezier(.16,1,.3,1);

}

.image:hover img {

  transform:
    scale(1.07);

}

.image-gradient {

  position:
    absolute;

  inset:
    0;

  background:

    linear-gradient(
      to top,
      rgba(0,0,0,.95),
      rgba(0,0,0,.08) 65%
    );

}


/* =========================================================
   HERO
========================================================= */

.hero {

  position:
    relative;

  min-height:
    calc(100vh - 74px);

  overflow:
    hidden;

  background:
    #09212B;

}

.hero-image {

  position:
    absolute;

  top:
    0;

  right:
    0;

  bottom:
    0;

  width:
    68%;

  background:
    center/cover
    no-repeat;

}

.hero-image::after {

  content:
    "";

  position:
    absolute;

  inset:
    0;

  background:

    linear-gradient(
      90deg,
      #071E29 0%,
      rgba(7,7,7,.92) 17%,
      rgba(7,7,7,.45) 48%,
      rgba(7,7,7,.18) 100%
    );

}

.hero-red-cut {

  position:
    absolute;

  top:
    0;

  bottom:
    0;

  left:
    35%;

  width:
    12%;

  background:
    rgba(129,216,208,.88);

  opacity:
    .7;

  transform:
    skewX(-17deg);

  transform-origin:
    center;

}

.hero-grid {

  position:
    absolute;

  inset:
    0;

  opacity:
    .17;

  background-image:

    linear-gradient(
      rgba(255,255,255,.05) 1px,
      transparent 1px
    ),

    linear-gradient(
      90deg,
      rgba(255,255,255,.05) 1px,
      transparent 1px
    );

  background-size:
    40px 40px;

}

.hero-content {

  position:
    relative;

  z-index:
    5;

}


/* =========================================================
   SECTION
========================================================= */

.section {

  border-top:
    1px solid var(--line);

  border-bottom:
    1px solid var(--line);

}

.section-title {

  font-family:
    "Barlow Condensed",
    sans-serif;

  font-weight:
    800;

  text-transform:
    uppercase;

  letter-spacing:
    -.03em;

  line-height:
    .9;

  font-size:
    clamp(42px,5vw,72px);

}


/* =========================================================
   CARDS
========================================================= */

.story-card {

  position:
    relative;

  overflow:
    hidden;

  background:
    #0D2F3B;

  border:
    1px solid var(--line);

  transition:
    .25s;

}

.story-card:hover {

  transform:
    translateY(-4px);

  border-color:
    rgba(129,216,208,.35);

}


/* =========================================================
   FORMS
========================================================= */

.field {

  width:
    100%;

  padding:
    13px 14px;

  background:
    #09212B;

  border:
    1px solid
    rgba(255,255,255,.11);

  color:
    white;

  outline:
    none;

  font-size:
    12px;

}

.field:focus {

  border-color:
    var(--red);

  box-shadow:
    0 0 0 3px
    rgba(129,216,208,.08);

}

.field::placeholder {

  color:
    #6D8A8D;

}

textarea.field {

  resize:
    vertical;

}


/* =========================================================
   ROUTE
========================================================= */

.route {

  animation:
    routeIn
    .3s
    ease both;

}

@keyframes routeIn {

  from {

    opacity:
      0;

    transform:
      translateY(12px);

  }

  to {

    opacity:
      1;

    transform:
      translateY(0);

  }

}


/* =========================================================
   MODAL
========================================================= */

.modal-bg {

  position:
    fixed;

  inset:
    0;

  z-index:
    300;

  display:
    flex;

  align-items:
    center;

  justify-content:
    center;

  padding:
    20px;

  background:
    rgba(0,0,0,.84);

  backdrop-filter:
    blur(10px);

}

.modal {

  width:
    min(760px,100%);

  max-height:
    calc(100vh - 40px);

  overflow:
    auto;

  background:
    #0A2530;

  border:
    1px solid
    rgba(255,255,255,.12);

  box-shadow:
    0 40px 120px
    rgba(0,0,0,.65);

  animation:
    modalIn .2s ease both;

}

@keyframes modalIn {

  from {

    opacity:
      0;

    transform:
      scale(.97)
      translateY(8px);

  }

  to {

    opacity:
      1;

    transform:
      scale(1)
      translateY(0);

  }

}


/* =========================================================
   TOAST
========================================================= */

#toast-container {

  position:
    fixed;

  z-index:
    400;

  right:
    20px;

  bottom:
    20px;

  width:
    min(390px, calc(100vw - 40px));

  display:
    flex;

  flex-direction:
    column;

  gap:
    9px;

}

.toast {

  display:
    flex;

  align-items:
    flex-start;

  gap:
    12px;

  background:
    #0D2F3B;

  border:
    1px solid var(--line);

  border-left:
    3px solid
    var(--red);

  padding:
    14px;

  box-shadow:
    0 20px 60px
    rgba(0,0,0,.5);

  animation:
    toastIn .2s ease both;

}

@keyframes toastIn {

  from {

    opacity:
      0;

    transform:
      translateX(15px);

  }

  to {

    opacity:
      1;

    transform:
      translateX(0);

  }

}


/* =========================================================
   TIMELINE
========================================================= */

.timeline-line {

  position:
    absolute;

  left:
    5px;

  top:
    14px;

  bottom:
    -20px;

  width:
    1px;

  background:
    #31545C;

}

.timeline-item:last-child
.timeline-line {

  display:
    none;

}

.timeline-dot {

  position:
    relative;

  z-index:
    2;

  width:
    11px;

  height:
    11px;

  background:
    #0D2F3B;

  border:
    2px solid
    #56777C;

  transform:
    rotate(45deg);

}

.timeline-dot.done {

  background:
    var(--red);

  border-color:
    var(--red);

}

.timeline-dot.live {

  background:
    white;

  border-color:
    var(--red);

}


/* =========================================================
   MOBILE
========================================================= */

@media (max-width: 1024px) {

  .desktop-nav {

    display:
      none;

  }

}

@media (min-width: 1025px) {

  .mobile-menu-trigger {

    display:
      none;

  }

}

@media (max-width: 800px) {

  .hero {

    min-height:
      760px;

  }

  .hero-image {

    width:
      100%;

    height:
      58%;

  }

  .hero-image::after {

    background:

      linear-gradient(
        to bottom,
        rgba(7,7,7,.05),
        rgba(7,7,7,.95)
      );

  }

  .hero-red-cut {

    left:
      48%;

  }

}

</style>
</head>


<body>

<!-- =========================================================
     HEADER
========================================================= -->

<header class="dl-header">

  <div
    class="max-w-[1440px] mx-auto h-full px-5 lg:px-10 flex items-center justify-between">

    <!-- LOGO -->

    <button
      onclick="navigateTo('home')"
      class="flex items-center gap-3 shrink-0">

      <div
        class="w-10 h-10 bg-[#0D2F3B] border border-white/10 flex items-center justify-center">

        <div
          class="w-6 h-6 bg-[#81D8D0]"
          style="
            clip-path:polygon(
              0 100%,
              50% 0,
              100% 100%,
              72% 100%,
              50% 55%,
              28% 100%
            )
          ">
        </div>

      </div>

      <div class="text-left">

        <div
          class="font-display font-bold text-[25px] uppercase tracking-tight">

          Diora<span class="text-[#81D8D0]">Link</span>

        </div>

        <div
          class="text-[7px] uppercase tracking-[.25em] text-[#6B8D8F]">

          Miniature Ecosystem

        </div>

      </div>

    </button>


    <!-- DESKTOP NAV -->

    <nav
      class="desktop-nav hidden lg:flex items-center h-full">

      <button
        data-route-nav="home"
        class="nav-button"
        onclick="navigateTo('home')">

        Home

      </button>


      <button
        data-route-nav="explore"
        class="nav-button"
        onclick="navigateTo('explore')">

        Creators

      </button>


      <button
        data-route-nav="commission"
        class="nav-button"
        onclick="navigateTo('commission')">

        Commission

      </button>


      <button
        data-route-nav="requests"
        class="nav-button"
        onclick="navigateTo('requests')">

        Requests

      </button>


      <button
        data-route-nav="projects"
        class="nav-button"
        onclick="navigateTo('projects')">

        Projects

      </button>


      <button
        class="nav-button"
        onclick="openComingSoon('V2.0','Marketplace')">

        Marketplace

      </button>


      <button
        class="nav-button"
        onclick="openComingSoon('V2.0','Community')">

        Community

      </button>


      <button
        data-route-nav="trust"
        class="nav-button"
        onclick="navigateTo('trust')">

        Trust

      </button>

    </nav>


    <!-- RIGHT -->

    <div
      class="flex items-center gap-2">

      <button
        onclick="openNotifications()"
        class="w-9 h-9 border border-white/10 flex items-center justify-center relative">

        <i
          data-lucide="bell"
          class="w-4 h-4 text-[#CFE8E6]">
        </i>

        <span
          id="notification-dot"
          class="absolute top-1 right-1 w-1.5 h-1.5 bg-[#81D8D0]">
        </span>

      </button>


      <button
        onclick="openAuthModal()"
        class="hidden md:flex px-3 py-2 items-center gap-2 text-[9px] uppercase font-black tracking-wider text-[#A7C4C4] hover:text-white">

        <i
          data-lucide="user"
          class="w-4 h-4">
        </i>

        Login

      </button>


      <button
        onclick="navigateTo('commission')"
        class="btn-red hidden sm:inline-flex">

        Start Creating

        <i
          data-lucide="arrow-right"
          class="w-3.5 h-3.5">
        </i>

      </button>


      <button
        onclick="toggleMobileNavigation()"
        class="mobile-menu-trigger lg:hidden w-9 h-9 border border-white/10 flex items-center justify-center">

        <i
          data-lucide="menu"
          class="w-4 h-4">
        </i>

      </button>

    </div>

  </div>


  <!-- MOBILE -->

  <div
    id="mobile-navigation"
    class="hidden lg:hidden bg-[#0A2833] border-t border-white/10 p-4">

    <div class="grid grid-cols-2 gap-2">

      <button
        class="btn-outline"
        onclick="closeMobileNavigation();navigateTo('home')">
        HOME
      </button>

      <button
        class="btn-outline"
        onclick="closeMobileNavigation();navigateTo('explore')">
        CREATORS
      </button>

      <button
        class="btn-outline"
        onclick="closeMobileNavigation();navigateTo('commission')">
        COMMISSION
      </button>

      <button
        class="btn-outline"
        onclick="closeMobileNavigation();navigateTo('requests')">
        REQUESTS
      </button>

      <button
        class="btn-outline"
        onclick="closeMobileNavigation();navigateTo('projects')">
        PROJECTS
      </button>

      <button
        class="btn-outline"
        onclick="closeMobileNavigation();navigateTo('account')">
        ACCOUNT
      </button>

      <button
        class="btn-outline"
        onclick="closeMobileNavigation();navigateTo('trust')">
        TRUST
      </button>

      <button
        class="btn-outline"
        onclick="closeMobileNavigation();openComingSoon('V2.0','Community')">

        COMMUNITY · V2

      </button>

    </div>

  </div>

</header>


<!-- =========================================================
     APP
========================================================= -->

<main
  id="app"
  class="pt-[74px] min-h-screen">
</main>


<!-- =========================================================
     TOAST
========================================================= -->

<div
  id="toast-container">
</div>


<!-- =========================================================
     MODAL ROOT
========================================================= -->

<div

/* =========================================================
   LOAD STATE
========================================================= */

function loadState() {

  const raw =
    localStorage.getItem(
      STORAGE_KEY
    );

  if (!raw) {

    return structuredClone(
      defaultState
    );

  }

  try {

    return JSON.parse(raw);

  }

  catch {

    return structuredClone(
      defaultState
    );

  }

}


let state =
  loadState();


function saveState() {

  localStorage.setItem(
    STORAGE_KEY,
    JSON.stringify(state)
  );

}


/* =========================================================
   UTILS
========================================================= */

function escapeHTML(value) {

  const div =
    document.createElement("div");

  div.textContent =
    value == null
      ? ""
      : String(value);

  return div.innerHTML;

}


function money(value) {

  return Number(
    value || 0
  ).toLocaleString("vi-VN") + "đ";

}


function apiURL(path) {

  return (
    window.DIORALINK_CONFIG.apiBase +
    path
  );

}


function creatorById(id) {

  return state.creators.find(
    c => c.id === id
  );

}


function projectById(id) {

  return state.projects.find(
    p => p.id === id
  );

}


function requestById(id) {

  return state.requests.find(
    r => r.id === id
  );

}


/* =========================================================
   TOAST
========================================================= */

function toast(
  message,
  type = "success"
) {

  const root =
    document.getElementById(
      "toast-container"
    );

  const div =
    document.createElement("div");

  const icon =
    type === "warning"
      ? "clock-3"
      : type === "error"
        ? "circle-alert"
        : "check-circle-2";

  div.className =
    "toast";

  div.innerHTML = `

    <div
      class="w-8 h-8 shrink-0 bg-white/5 flex items-center justify-center">

      <i
        data-lucide="${icon}"
        class="w-4 h-4 ${type === "warning"
          ? "text-[#81D8D0]"
          : type === "error"
            ? "text-[#81D8D0]"
            : "text-[#C9F7F0]"}">
      </i>

    </div>

    <div
      class="flex-1 text-xs text-[#CFE8E6] leading-5">

      ${escapeHTML(message)}

    </div>

    <button
      onclick="this.parentElement.remove()"
      class="text-[#6B8D8F] hover:text-white">

      ×

    </button>

  `;

  root.appendChild(div);

  lucide.createIcons();

  setTimeout(
    () => div.remove(),
    4500
  );

}


/* =========================================================
   NAVIGATION
========================================================= */

function currentRoute() {

  return (
    location.hash
      .replace(/^#/,"")
      .trim() ||
    "home"
  );

}


function navigateTo(route) {

  if (
    currentRoute() === route
  ) {

    render();

    return;

  }

  location.hash =
    route;

}


window.addEventListener(
  "hashchange",
  render
);


/* =========================================================
   NAV ACTIVE
========================================================= */

function updateNav() {

  const route =
    currentRoute()
      .split("/")[0];

  document
    .querySelectorAll(
      "[data-route-nav]"
    )
    .forEach(
      button => {

        button.classList.toggle(
          "active",
          button.dataset.routeNav === route
        );

      }
    );

}


/* =========================================================
   ROUTER
========================================================= */

function render() {

  updateNav();

  const route =
    currentRoute()
      .split("/");

  const name =
    route[0];

  const param =
    route.slice(1).join("/");


  switch(name) {

    case "home":

      renderHome();

      break;


    case "explore":

      renderExplore();

      break;


    case "creator":

      renderCreator(
        param
      );

      break;


    case "commission":

      renderCommission();

      break;


    case "requests":

      renderRequests();

      break;


    case "request":

      renderRequest(
        param
      );

      break;


    case "projects":

      renderProjects();

      break;


    case "project":

      renderProject(
        param
      );

      break;


    case "account":

      renderAccount();

      break;


    case "trust":

      renderTrust();

      break;


    default:

      renderNotFound();

  }


  window.scrollTo({
    top: 0,
    behavior: "instant"
  });

  setTimeout(
    () => lucide.createIcons(),
    0
  );

  updateNotificationDot();

}

let exploreQuery = "";

let exploreCategory =

let exploreBudget =

function renderExplore() {

  const creators =
    state.creators.filter(
      c => {

        const q =
          exploreQuery
            .trim()
            .toLowerCase();

        const queryMatch =
          !q ||
          c.name
            .toLowerCase()
            .includes(q) ||
          c.handle
            .toLowerCase()
            .includes(q) ||
          c.specialties
            .join(" ")
            .toLowerCase()
            .includes(q);

        const categoryMatch =
          exploreCategory === "all" ||
          c.specialties
            .some(
              x =>
                x.toLowerCase() ===
                exploreCategory.toLowerCase()
            );

        const budgetMatch =
          c.startingPrice <=
          exploreBudget;

        return (
          queryMatch &&
          categoryMatch &&
          budgetMatch
        );

function toggleSavedCreator(id) {

  const exists =
    state.savedCreators.includes(
      id
    );

  if (exists) {

    state.savedCreators =
      state.savedCreators.filter(
        x => x !== id
      );

    toast(
      "Creator đã được bỏ khỏi danh sách lưu.",
      "warning"
    );

  }

  else {

    state.savedCreators.push(
      id
    );

    toast(
      "Creator đã được lưu."
    );

  }

  saveState();

  render();

}


function selectCreator(
  id,
  specialty = null
) {

  state.commissionDraft =
    state.commissionDraft || {};

  state.commissionDraft.preferredCreator =
    id;

  state.commissionDraft.creatorMode =
    "specific";

  if (specialty) {

    state.commissionDraft.style =
      specialty;

  }

  saveState();

  toast(
    "Creator đã được chọn cho commission."
  );

  navigateTo(
    "commission"
  );

}

function nextCommission(step) {

  const d =
    state.commissionDraft;


  if (step === 1) {

    if (
      !d.title ||
      !d.size ||
      !d.description
    ) {

      toast(
        "Hoàn thiện title, size và description trước.",
        "warning"
      );

      return;

    }

    commissionStep =
      2;

  }


  else if (step === 2) {

    if (
      !d.budget ||
      !d.timeline
    ) {

      toast(
        "Nhập budget và timeline trước.",
        "warning"
      );

      return;

    }

    commissionStep =
      3;

  }


  else if (step === 3) {

    if (
      d.creatorMode === "specific" &&
      !d.preferredCreator
    ) {

      toast(
        "Chưa chọn creator.",
        "warning"
      );

      return;

    }

    commissionStep =
      4;

  }


  saveState();

  renderCommission();

}


function handleBriefFiles(files) {

  state.commissionDraft.references =
    [

      ...(state.commissionDraft.references || []),

      ...Array
        .from(files)
        .map(
          file =>
            file.name
        )

    ].slice(
      0,
      10
    );

  saveState();

  renderCommission();

  toast(
    `${files.length} file đã được thêm.`
  );

}

function submitCommission() {

  const d =
    state.commissionDraft;


  const id =
    `REQ-${new Date().getFullYear()}-${String(state.requests.length + 2).padStart(3,"0")}`;


  const request = {

    id,

    title:
      d.title,

    style:
      d.style,

    size:
      d.size,

    budget:
      Number(d.budget),

    timeline:
      d.timeline,

    description:
      d.description,

    creatorMode:
      d.creatorMode,

    createdAt:
      new Date()
        .toISOString()
        .slice(
          0,
          10
        ),

    status:
      "Proposal received",

    selectedProposal:
      null,

    proposals:
      generateProposals(d)

  };


  state.requests.unshift(
    request
  );


  addNotification({

    title:
      "Commission request created",

    body:
      `${request.title} đã được tạo và đang chờ proposal.`,

    time:
      "Vừa xong",

    route:
      `request/${request.id}`

  });


  state.commissionDraft = {

    title:
      "",

    style:
      "Fantasy",

    size:
      "",

    budget:
      "",

    timeline:
      "",

    description:
      "",

    references:
      [],

    creatorMode:
      "matching",

    preferredCreator:
      ""

  };


  saveState();

  toast(
    "Commission request đã được tạo."
  );


  setTimeout(
    () =>
      navigateTo(
        `request/${request.id}`
      ),
    300
  );

}


function generateProposals(d) {

  let pool =
    d.creatorMode === "specific"
      ? [
          creatorById(
            d.preferredCreator
          )
        ].filter(Boolean)
      : state.creators
          .filter(
            c =>
              c.verified
          )
          .slice(
            0,
            3
          );


  return pool.map(
    (creator,index) => {

      const multiplier =
        [1,.94,1.08][index] ||
        1;

      return {

        id:
          "PROP-" +
          Date.now() +
          "-" +
          index,

        creatorId:
          creator.id,

        quote:
          Math.round(
            (
              Number(d.budget) *
              multiplier
            ) / 50000
          ) *
          50000,

        timeline:
          creator.id === "C-001"
            ? "48 ngày"
            : creator.id === "C-002"
              ? "42 ngày"
              : "55 ngày",

        message:
          "Mình đã xem brief. Có thể triển khai theo milestone để customer kiểm soát tiến độ và scope.",

        deliverables: [

          "Concept refinement",

          "Base structure",

          "Production updates",

          "Final delivery"

        ],

        status:
          "Pending"

      };

    }
  );

}

/* =========================================================
   APPROVE MILESTONE
========================================================= */

function approveMilestone(
  projectId,
  milestoneId
) {

  const project =
    projectById(
      projectId
    );

  const milestone =
    project?.milestones.find(
      m =>
        m.id ===
        milestoneId
    );

  if (!project || !milestone)
    return;


  if (
    milestone.status !==
    "submitted"
  ) {

    toast(
      "Milestone chưa ở trạng thái cần duyệt.",
      "warning"
    );

    return;

  }


  milestone.status =
    "approved";

  milestone.approvedAt =
    new Date().toISOString();


  project.progress =
    project.milestones
      .filter(
        m =>
          m.status ===
          "approved"
      )
      .reduce(
        (
          total,
          m
        ) =>
          total +
          m.percentage,
        0
      );


  project.currentMilestone =
    Math.min(
      project.milestones.length,
      project.milestones.findIndex(
        m =>
          m.status !==
          "approved"
      ) + 1
    );


  project.status =
    project.progress >= 100
      ? "Completed"
      : "In production";


  project.activity.unshift({

    text:
      `Milestone approved · ${milestone.name}`,

    time:
      new Date().toLocaleString(
        "vi-VN"
      )

  });


  addNotification({

    title:
      "Milestone approved",

    body:
      `${milestone.name} đã được customer approve.`,

    time:
      "Vừa xong",

    route:
      `project/${project.id}`

  });


  saveState();

  toast(
    "Milestone đã được approve."
  );

  projectTab =
    "milestones";

  renderProject(
    project.id
  );

}


function simulateCreatorUpdate(
  projectId,
  milestoneId
) {

  const project =
    projectById(
      projectId
    );

  const milestone =
    project?.milestones.find(
      m =>
        m.id ===
        milestoneId
    );

  if (!project || !milestone)
    return;


  milestone.status =
    "submitted";

  milestone.evidence =
    `Creator submitted production evidence at ${new Date().toLocaleString("vi-VN")}.`;


  project.activity.unshift({

    text:
      `Creator submitted evidence · ${milestone.name}`,

    time:
      new Date().toLocaleString(
        "vi-VN"
      )

  });


  addNotification({

    title:
      "Milestone awaiting approval",

    body:
      `${milestone.name} đã có evidence mới.`,

    time:
      "Vừa xong",

    route:
      `project/${project.id}`

  });


  saveState();

  toast(
    "Creator evidence đã được submit."
  );

  renderProject(
    project.id
  );

}


function openCurrentMilestone(
  projectId
) {

  const project =
    projectById(
      projectId
    );

  if (!project)
    return;


  const milestone =
    project.milestones.find(
      m =>
        m.status ===
        "submitted"
    ) ||
    project.milestones.find(
      m =>
        m.status ===
        "pending"
    );


  if (!milestone) {

    toast(
      "Project đã hoàn tất."
    );

    return;

  }


  openMilestone(
    project.id,
    milestone.id
  );

}

function handleProjectFiles(
  files,
  projectId
) {

  const project =
    projectById(
      projectId
    );

  if (!project)
    return;


  Array
    .from(files)
    .forEach(
      file => {

        project.files.unshift({

          name:
            file.name,

          type:
            file.type.includes("image")
              ? "IMAGE"
              : file.type.includes("pdf")
                ? "PDF"
                : "FILE",

          size:
            `${(
              file.size /
              1024 /
              1024
            ).toFixed(2)} MB`,

          date:
            new Date()
              .toISOString()
              .slice(
                0,
                10
              )

        });

      }
    );


  project.activity.unshift({

    text:
      `${files.length} file(s) uploaded`,

    time:
      new Date().toLocaleString(
        "vi-VN"
      )

  });


  saveState();

  toast(
    `${files.length} file đã được thêm.`
  );

  projectTab =
    "files";

  renderProject(
    projectId
  );

}


function previewFile(

) {

  const project =

  const file =
    project.files.find(

  openModal(`

function sendProjectMessage(
  projectId
) {

  const input =
    document.getElementById(
      "chat-input"

  const text =
    input?.value.trim();


  if (!text)
    return;


  const project =
    projectById(
      projectId
    );


  project.messages.push({

    id:
      "MSG-" +
      Date.now(),

    from:
      "customer",

    text,

    time:
      new Date()
        .toLocaleTimeString(
          "vi-VN",
          {
            hour:
              "2-digit",

            minute:
              "2-digit"
          }
        )

  });


  project.activity.unshift({

    text:
      "Customer sent a project message",

    time:
      new Date().toLocaleString(
        "vi-VN"

  saveState();

  projectTab =

    projectId

async function startMomoPayment(
  projectId,
  milestoneId,
  amount
) {

  try {

    toast(
      "Đang tạo phiên thanh toán MoMo..."
    );


    const response =
      await fetch(
        apiURL(
          "/api/payments/momo/create"
        ),
        {

          method:
            "POST",

          headers: {

            "Content-Type":
              "application/json"

          },

          body:
            JSON.stringify({

              projectId,

              milestoneId,

              amount,

              orderInfo:
                `DioraLink ${milestoneId}`

            })

        }
      );


    const data =
      await response.json();


    if (!response.ok) {

      throw new Error(
        data.message ||
        "Payment creation failed"
      );

    }


    closeModal();


    /*
     * MoMo returns payment URL.
     */

    if (data.payUrl) {

      location.href =
        data.payUrl;

      return;

    }


    toast(
      "Payment URL không được trả về.",
      "warning"
    );

  }

  catch(error) {

    /*
     * This is expected if the HTML
     * is opened without backend.
     */

    toast(
      "Backend payment chưa được kết nối: " +
      error.message,
      "warning"
    );

  }

}

async function loginEmail(event) {

  event.preventDefault();

  const email =
    document.getElementById("login-email")
      .value
      .trim()
      .toLowerCase();

  const password =
    document.getElementById("login-password")
      .value;

  if (!email || !password)
    return;

  const submit =
    document.getElementById("login-submit");

  if (submit) {
    submit.disabled = true;
    submit.textContent = "Signing in...";
  }

  try {

    const response =
      await fetch(
        apiURL("/api/auth/login"),
        {
          method: "POST",
          credentials: "include",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            email,
            password
          })
        }
      );

    const data =
      await response.json();

    if (!response.ok) {

      throw new Error(
        data.message ||
        "Đăng nhập thất bại."
      );

    }

    state.user = {
      ...state.user,
      ...(data.session?.user || {}),
      authenticated: true,
      provider: "email"
    };

    saveState();

    closeModal();

    toast("Đăng nhập thành công.");

    navigateTo("account");

  }

  catch(error) {

    toast(
      error.message ||
      "Không thể đăng nhập.",
      "warning"
    );

  }

  finally {

    if (submit) {
      submit.disabled = false;
      submit.textContent = "Continue";
    }

  }

}


async function registerEmail(event) {

  event.preventDefault();

  const name =
    document.getElementById("register-name")
      .value
      .trim();

  const email =
    document.getElementById("register-email")
      .value
      .trim()
      .toLowerCase();

  const password =
    document.getElementById("register-password")
      .value;

  const confirmPassword =
    document.getElementById("register-password-confirm")
      .value;

  if (!name || !email || !password || !confirmPassword)
    return;

  if (password.length < 8) {

    toast(
      "Mật khẩu phải có ít nhất 8 ký tự.",
      "warning"
    );

    return;

  }

  if (password !== confirmPassword) {

    toast(
      "Mật khẩu xác nhận không khớp.",
      "warning"
    );

    return;

  }

  const submit =
    document.getElementById("register-submit");

  if (submit) {
    submit.disabled = true;
    submit.textContent = "Creating...";
  }

  try {

    const response =
      await fetch(
        apiURL("/api/auth/register"),
        {
          method: "POST",
          credentials: "include",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            name,
            email,
            password
          })
        }
      );

    const data =
      await response.json();

    if (!response.ok) {

      throw new Error(
        data.message ||
        "Đăng ký thất bại."
      );

    }

    state.user = {
      ...state.user,
      ...(data.session?.user || {}),
      authenticated: true,
      provider: "email"
    };

    saveState();

    closeModal();

    toast("Tạo tài khoản thành công.");

    navigateTo("account");

  }

  catch(error) {

    toast(
      error.message ||
      "Không thể tạo tài khoản.",
      "warning"
    );

  }

  finally {

    if (submit) {
      submit.disabled = false;
      submit.textContent = "Create Account";
    }

  }

}


async function restoreSession() {

  try {

    const response =
      await fetch(
        apiURL("/api/auth/me"),
        {
          method: "GET",
          credentials: "include"
        }
      );

    if (response.ok) {

      const data =
        await response.json();

      if (data.user) {

        state.user = {
          ...state.user,
          ...data.user,
          authenticated: true
        };

        saveState();

      }

      return;

    }

    if (response.status === 401) {

      state.user = {
        ...defaultState.user,
        authenticated: false,
        provider: "prototype"
      };

      saveState();

    }

  }

  catch(error) {

    console.warn(
      "Session restore failed:",
      error.message
    );

  }

}

function loginGoogle() {

  const clientId =
    window.DIORALINK_CONFIG.googleClientId;

  if (
    !clientId ||
    clientId.includes("YOUR_GOOGLE")
  ) {

    toast(
      "Chưa cấu hình Google Client ID.",
      "warning"
    );

    return;

  }

  if (
    !window.google ||
    !google.accounts ||
    !google.accounts.id
  ) {

    toast(
      "Google Identity Services chưa sẵn sàng.",
      "warning"
    );

    return;

  }

  google.accounts.id.initialize({
    client_id: clientId,
    callback: handleGoogleCredential
  });

  google.accounts.id.prompt();

}


async function handleGoogleCredential(response) {

  try {

    const result =
      await fetch(
        apiURL("/api/auth/google"),
        {
          method: "POST",
          credentials: "include",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            credential: response.credential
          })
        }
      );

    const data =
      await result.json();

    if (!result.ok) {

      throw new Error(
        data.message ||
        "Google authentication failed"
      );

    }

    state.user = {
      ...state.user,
      ...(data.session?.user || {}),
      authenticated: true,
      provider: "google"
    };

    saveState();
    closeModal();
    toast("Đăng nhập Google thành công.");
    navigateTo("account");

  }

  catch(error) {

    toast(
      error.message,
      "warning"
    );

  }

}


/* =========================================================
   FACEBOOK LOGIN
========================================================= */

function loginFacebook() {

  if (
    !window.DIORALINK_CONFIG.facebookAppId ||
    window.DIORALINK_CONFIG.facebookAppId.includes(
      "YOUR_FACEBOOK"
    )
  ) {

    toast(
      "Chưa cấu hình Facebook App ID.",
      "warning"
    );

    return;

  }

  if (!window.FB) {

    toast(
      "Facebook SDK chưa sẵn sàng.",
      "warning"
    );

    return;

  }

  FB.login(
    async response => {

      if (!response?.authResponse) {

        toast(
          "Facebook login đã bị huỷ.",
          "warning"
        );

        return;

      }

      try {

        const result =
          await fetch(
            apiURL("/api/auth/facebook"),
            {
              method: "POST",
              credentials: "include",
              headers: {
                "Content-Type": "application/json"
              },
              body: JSON.stringify({
                accessToken:
                  response.authResponse.accessToken
              })
            }
          );

        const data =
          await result.json();

        if (!result.ok) {

          throw new Error(
            data.message ||
            "Facebook authentication failed"
          );

        }

        state.user = {
          ...state.user,
          ...(data.session?.user || {}),
          authenticated: true,
          provider: "facebook"
        };

        saveState();
        closeModal();
        toast("Đăng nhập Facebook thành công.");
        navigateTo("account");

      }

      catch(error) {

        toast(
          error.message,
          "warning"
        );

      }

    },
    {
      scope: "public_profile,email"
    }
  );

}

                            ${escapeHTML(n.body)}

                          </div>

                          <div
                            class="text-[8px] text-[#507174] uppercase mt-2">

                            ${escapeHTML(n.time)}

                          </div>

                        </div>

                      </div>

                    </button>

                  `
                ).join("")
            : `

              <div
                class="p-10 text-center text-[#6B8D8F]">

                No notifications.

              </div>

            `
        }

      </div>

    </div>

  `);

}


function openNotification(id) {

  const item =
    state.notifications.find(
      n =>
        n.id === id
    );

  if (!item)
    return;


  item.read =
    true;

  saveState();

  closeModal();

  if (item.route)
    navigateTo(
      item.route
    );

}


/* =========================================================
   MODAL
========================================================= */

function openModal(
  html
) {

  document.getElementById(
    "modal-root"
  ).innerHTML = `

    <div
      class="modal-bg"
      onclick="closeModal(event)">

      <div
        class="modal angular"
        onclick="event.stopPropagation()">

        ${html}

      </div>

    </div>

  `;


  lucide.createIcons();

}


function closeModal(
  event
) {

  if (
    event &&
    event.target !==
      event.currentTarget
  ) {

    return;

  }


  document.getElementById(
    "modal-root"
  ).innerHTML = "";

}

/* =========================================================
   STRUCTURED DATA
========================================================= */

function showRequestData(
  id
) {

  const request =
    requestById(
      id
    );


  openModal(`

    <div class="p-7">

      <div class="label">
        Structured Object
      </div>

      <h2
        class="font-display text-4xl uppercase mt-3">

        REQUEST DATA.

      </h2>


      <pre
        class="bg-[#071E29]/50 border border-white/5 p-5 mt-7 text-[10px] leading-5 text-[#DFFCF8] overflow-auto max-h-[500px]">${escapeHTML(JSON.stringify(request,null,2))}</pre>

/* =========================================================
   GENERIC 404
========================================================= */

function renderNotFound() {

  document.getElementById("app").innerHTML = `

    <div
      class="route max-w-[700px] mx-auto px-5 py-28 text-center">

      <div
        class="font-display text-[120px] text-[#81D8D0]">

        404

      </div>

      <h1
        class="font-display text-5xl uppercase">

        Page Not Found

      </h1>

      <p
        class="text-xs text-[#6B8D8F] mt-3">

        Route không tồn tại trong DioraLink V1.

      </p>


      <button
        onclick="navigateTo('home')"
        class="btn-red mt-7">

        Back Home

      </button>

    </div>

  `;

}


/* =========================================================
   NEWSLETTER
========================================================= */

function subscribeNewsletter(
  event
) {

  event.preventDefault();


  const email =
    document.getElementById(
      "newsletter-email"
    ).value.trim();


  if (!email)
    return;


  toast(
    `Email ${email} đã được ghi nhận.`
  );


  event.target.reset();

}


/* =========================================================
   MOBILE NAV
========================================================= */

function toggleMobileNavigation() {

  document
    .getElementById(
      "mobile-navigation"
    )
    .classList.toggle(
      "hidden"
    );

}


function closeMobileNavigation() {

  document
    .getElementById(
      "mobile-navigation"
    )
    .classList.add(
      "hidden"
    );

}


/* =========================================================
   KEYBOARD
========================================================= */

document.addEventListener(
  "keydown",
  event => {

    if (
      event.key ===
      "Escape"
    ) {

      closeModal();

      closeMobileNavigation();

    }


    if (
      (
        event.ctrlKey ||
        event.metaKey
      ) &&
      event.key.toLowerCase() ===
      "k"
    ) {

      event.preventDefault();

      navigateTo(
        "explore"
      );

    }

  }
);


/* =========================================================
   INITIALIZATION
========================================================= */

document.addEventListener(
  "DOMContentLoaded",
  async () => {

    await restoreSession();

    render();

    lucide.createIcons();

  }
);

</script>
